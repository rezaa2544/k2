  // ---- ماژول آزمون‌های جامع دوره‌ای ----
  // چرا این ماژول جدا است: آزمون جامع و تحلیل آن دو کار مستقل‌اند. آزمون
  // رویداد سنجش است، تحلیل کار شناخنی روی نتیجه. اگر یکی شوند، «آزمون دادم»
  // به‌جای «دانستم چه کردی» ثبت می‌شود و برنامه عوض نمی‌شود.
  //
  // قاعدهٔ صداقت: بازهٔ ۱۴ روزه و تاریخ شروع ۱۴ آبان ۱۴۰۵ ورودی کاربر است،
  // نه ادعای رسمی. تاریخ رسمی آزمون ابلاغ نشده و اینجا چیزی جعل نمی‌شود.

  const EXAM_SERIES_DEFAULTS = {
    enabled: true,
    startISO: '2026-11-05',   // ۱۴ آبان ۱۴۰۵ (تقویم شمسی)
    intervalDays: 14,
    durationMinutes: 210,     // برآورد خود کاربر؛ قابل ویرایش
    analysisMinutes: 60,      // تحلیل جدا و مستقل از خود آزمون
    startNote: 'تاریخ شروع و بازهٔ تکرار را خودت تعیین می‌کنی؛ هیچ تاریخ رسمی ابلاغ نشده است.'
  };

  // تقسیم صحیح به سمت صفر، مثل div استاندارد جلالی. Math.floor اینجا غلط
  // است: div(3-8, 6) باید 0 شود نه 1- و کل تاریخ یک ماه و دو سال جابه‌جا می‌شود.
  function jDiv(a, b) { return Math.trunc(a / b) }
  function jMod(a, b) { return a - jDiv(a, b) * b }

  // تبدیل تقویم: الگوریتم استاندارد جلالی (بدون وابستگی بیرونی)
  function jalBreaks() {
    return [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  }
  function jG2D(gy, gm, gd) {
    let d = jDiv((gy + jDiv(gm - 8, 6) + 100100) * 1461, 4) + jDiv(153 * jMod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - jDiv(jDiv(gy + 100100 + jDiv(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function jD2G(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + jDiv(jDiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = jDiv(jMod(j, 1461), 4) * 5 + 308;
    const gd = jDiv(jMod(i, 153), 5) + 1;
    const gm = jDiv(i, 153) + 1;
    const gy = jDiv(j, 1461) - 100100 + jDiv(8 - gm, 6);
    return { gy, gm, gd };
  }
  function jalCal(jy) {
    const breaks = jalBreaks(), bl = breaks.length;
    const gy = jy + 621;
    let leapJ = -14, jp = breaks[0], jm = 0, jump = 0, leap = 0, n = 0;
    for (let i = 1; i < bl; i += 1) {
      jm = breaks[i]; jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + jDiv(jump, 33) * 8 + jDiv(jMod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ = leapJ + jDiv(n, 33) * 8 + jDiv(jMod(n, 33) + 3, 4);
    if (jMod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = jDiv(gy, 4) - jDiv((jDiv(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + jDiv(jump + 4, 33) * 33;
    leap = jMod(jMod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { gy, march, leap };
  }
  function jJ2D(jy, jm, jd) {
    const r = jalCal(jy);
    return jG2D(r.gy, 3, r.march) + (jm - 1) * 31 - jDiv(jm, 7) * (jm - 7) + jd - 1;
  }
  function jD2J(jdn) {
    const gy = jD2G(jdn).gy;
    let jy = gy - 621;
    let r = jalCal(jy);
    let k = jdn - jG2D(gy, 3, r.march);
    if (k >= 0) {
      if (k <= 185) return { jy, jm: 1 + jDiv(k, 31), jd: jMod(k, 31) + 1 };
      k -= 186;
    } else {
      jy -= 1; k += 179; if (r.leap === 1) k += 1;
      r = jalCal(jy);
    }
    return { jy, jm: 7 + jDiv(k, 30), jd: jMod(k, 30) + 1 };
  }
  const JALALI_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
    'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

  // 'YYYY-MM-DD' → {jy,jm,jd}
  function isoToJalali(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    return jD2J(jG2D(Number(m[1]), Number(m[2]), Number(m[3])));
  }
  // {jy,jm,jd} → 'YYYY-MM-DD'
  function jalaliToIso(jy, jm, jd) {
    const g = jD2G(jJ2D(jy, jm, jd));
    return `${String(g.gy).padStart(4, '0')}-${String(g.gm).padStart(2, '0')}-${String(g.gd).padStart(2, '0')}`;
  }
  // برچسب خوانا: «۱۴ آبان ۱۴۰۵»
  function jalaliLabel(iso) {
    const j = isoToJalali(iso);
    if (!j) return String(iso || '—');
    return `${j.jd} ${JALALI_MONTHS[j.jm - 1]} ${j.jy}`;
  }
  function isoAddDays(iso, days) {
    const d = new Date(`${iso}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function isoBetween(iso, from, to) { return iso >= from && iso <= to }

  function ensureExamSeries() {
    // ادغام نرم پیش‌فرض‌ها: state ذخیره‌شدهٔ کاربر بازنویسی نمی‌شود.
    const cur = state.examSeries || {};
    state.examSeries = { ...EXAM_SERIES_DEFAULTS, ...cur };
    if (state.examSeries.intervalDays < 1) state.examSeries.intervalDays = 1;
    return state.examSeries;
  }

  // تاریخ‌های وقوع در بازهٔ [from, to] — مرزها هم شاملند.
  function examSeriesOccurrences(series, from, to) {
    if (!series || series.enabled === false) return [];
    const start = String(series.startISO || '');
    if (!start) return [];
    const step = Math.max(1, Math.round(num(series.intervalDays, 14)));
    const out = [];
    // نخستین وقوع بزرگ‌تر یا مساوی از
    let first = start;
    if (from > start) {
      const diff = Math.round((new Date(`${from}T00:00:00Z`) - new Date(`${start}T00:00:00Z`)) / 86400000);
      const k = Math.floor(diff / step);
      first = isoAddDays(start, k * step);
      // اگر نزدیک‌ترین وقوع پیش از بازه افتاد، تا رسیدن به آن جلو می‌رویم.
      while (first < from) first = isoAddDays(first, step);
    }
    for (let iso = first; iso <= to; iso = isoAddDays(iso, step)) {
      if (iso >= start) out.push(iso);
      if (out.length > 200) break; // محافظ: حلقهٔ بی‌پایان نشود
    }
    return out;
  }

  // وقوع‌ها را به دو فعالیت مستقل تبدیل می‌کند: خود آزمون و تحلیل آن.
  function syncExamSeries(todayIso) {
    ensureExamSeries();
    const s = state.examSeries;
    if (!s.enabled) return 0;
    const today = todayIso || todayISO();
    const horizon = isoAddDays(today, 60);
    let created = 0;
    for (const iso of examSeriesOccurrences(s, today, horizon)) {
      const label = jalaliLabel(iso);
      const has = role => (state.activities || []).some(a => a.examOccurrence === iso && a.examRole === role);
      const base = {
        date: iso, examOccurrence: iso, origin: 'examSeries',
        deadline: 'hard', deadlineDate: iso, subjectId: '', subjectName: '',
        topicId: null, topicName: '', state: 'planned', splittable: false,
        minChunk: 15, maxChunk: Math.max(15, Math.min(90, num(s.durationMinutes, 210))),
        personalWeight: 1, reason: ''
      };
      if (!has('exam')) {
        const est = Math.max(1, Math.round(num(s.durationMinutes, 210)));
        state.activities.unshift({
          ...base, id: id(), title: `آزمون جامع دوره‌ای · ${label}`, type: 'exam', examRole: 'exam',
          estimate: est, remaining: est,
          reason: `چرخهٔ ${Math.round(num(s.intervalDays, 14))} روزه؛ این نوبت ${label}. آزمون رویداد سنجش است، نه خودِ یادگیری.`
        });
        created += 1;
      }
      if (!has('analysis')) {
        const est = Math.max(1, Math.round(num(s.analysisMinutes, 60)));
        state.activities.unshift({
          ...base, id: id(), title: `تحلیل آزمون جامع · ${label}`, type: 'test_analysis', examRole: 'analysis',
          estimate: est, remaining: est,
          reason: `تحلیل مستقل از آزمون ${label}: گلوگاه درس، کد خطای غالب و اقدام اصلاحی. بدون تحلیل، نوبت بعدی همان اشتباه را تکرار می‌کند.`
        });
        created += 1;
      }
    }
    return created;
  }

  function examSeriesForm() {
    const s = ensureExamSeries();
    dialog('تنظیم چرخهٔ آزمون جامع', `<form id="modalForm"><p class="card-body">آزمون و تحلیل آن دو فعالیت مستقل می‌شوند. بازهٔ تکرار و تاریخ شروع را خودت تعیین می‌کنی؛ تاریخ رسمی آزمون ابلاغ نشده و اینجا چیزی جعل نمی‌شود.</p><div class="form-grid"><label>تاریخ اولین نوبت (میلادی)<input type="date" name="startISO" value="${esc(s.startISO)}" required></label><label>بازهٔ تکرار (روز)<input type="number" name="intervalDays" min="1" max="90" value="${Math.round(num(s.intervalDays, 14))}" required></label><label>مدت خودِ آزمون (دقیقه)<input type="number" name="durationMinutes" min="15" max="600" value="${Math.round(num(s.durationMinutes, 210))}" required></label><label>مدت تحلیل (دقیقه)<input type="number" name="analysisMinutes" min="5" max="600" value="${Math.round(num(s.analysisMinutes, 60))}" required></label><label class="check-label"><input type="checkbox" name="enabled" ${s.enabled !== false ? 'checked' : ''}> چرخه فعال باشد</label></div><p class="card-body">تاریخ میلادی برای دقت ذخیره می‌شود؛ معادل شمسی همان روز: <strong>${esc(jalaliLabel(s.startISO))}</strong></p><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیرهٔ چرخه</button></div></form>`);
    setModalType('examSeries');
  }

  function submitExamSeries(form) {
    const d = new FormData(form), v = n => d.get(n);
    const start = String(v('startISO') || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) { notify('تاریخ شروع معتبر نیست'); return; }
    const intervalDays = Math.max(1, Math.min(90, Math.round(num(v('intervalDays'), 14))));
    const durationMinutes = Math.max(15, Math.min(600, Math.round(num(v('durationMinutes'), 210))));
    const analysisMinutes = Math.max(5, Math.min(600, Math.round(num(v('analysisMinutes'), 60))));
    const enabled = d.has('enabled');
    state.examSeries = { ...ensureExamSeries(), startISO: start, intervalDays, durationMinutes, analysisMinutes, enabled };
    // نوبت‌های آینده با مدت تازه ساخته می‌شوند؛ نوبت‌های گذشته دست‌نخورده می‌مانند.
    const created = syncExamSeries();
    saveAndRender(created > 0
      ? `چرخه ذخیره شد · ${created} فعالیت مستقل برای نوبت‌های پیش‌رو ساخته شد`
      : 'چرخه ذخیره شد؛ نوبت پیش‌رو همین حالا در برنامه است');
  }

  // کارت نمایش چرخه در صفحهٔ آزمون‌های جامع
  function examSeriesCard() {
    const s = ensureExamSeries();
    const today = todayISO();
    const next = examSeriesOccurrences(s, today, isoAddDays(today, 60)).slice(0, 6);
    const registered = (state.attempts || []).filter(a => a.kind === 'official' || a.kind === 'mock');
    const occ = iso => {
      const done = registered.some(a => String(a.date || '').slice(0, 10) === iso);
      const acts = (state.activities || []).filter(a => a.examOccurrence === iso);
      const examAct = acts.find(a => a.examRole === 'exam');
      const anAct = acts.find(a => a.examRole === 'analysis');
      return { iso, done, examAct, anAct };
    };
    const rows = next.map(o => {
      const r = occ(o);
      const status = r.done ? 'ثبت‌شده' : (r.examAct?.state === 'done' ? 'انجام‌شده' : 'در انتظار');
      const analysis = r.anAct ? (r.anAct.state === 'done' ? 'تحلیل انجام شد' : 'تحلیل مستقل در برنامه') : '—';
      return `<tr><td>${esc(jalaliLabel(o))}</td><td>${esc(o)}</td><td>${esc(DAYS[weekdayOfIso(o)])}</td><td>${esc(Math.round(num(s.durationMinutes, 210)))}</td><td>${esc(Math.round(num(s.analysisMinutes, 60)))}</td><td>${esc(status)}</td><td>${esc(analysis)}</td></tr>`;
    }).join('');
    return `<article class="card tone-exam"><div class="section-row"><h3 class="card-title">چرخهٔ آزمون جامع تکرارشونده</h3>${actionBtn('ویرایش چرخه', 'exam-series-edit')}</div><p class="card-body">هر نوبت دو فعالیت <strong>مستقل</strong> می‌سازد: خودِ آزمون و تحلیل آن. یکی می‌تواند انجام شود و دیگری نه؛ وضعیت یکی به دیگری سرریز نمی‌شود.${s.enabled === false ? '<br><strong>چرخه در حال حاضر غیرفعال است.</strong>' : ''}</p><div class="metrics"><article class="metric tone-exam"><p class="metric-label">نخستین نوبت</p><p class="metric-value">${esc(jalaliLabel(s.startISO))}</p><p class="metric-hint">${esc(s.startISO)}</p></article><article class="metric tone-exam"><p class="metric-label">بازهٔ تکرار</p><p class="metric-value">${esc(Math.round(num(s.intervalDays, 14)))} روز</p><p class="metric-hint">قابل ویرایش</p></article><article class="metric tone-exam"><p class="metric-label">مدت آزمون / تحلیل</p><p class="metric-value">${esc(Math.round(num(s.durationMinutes, 210)))} / ${esc(Math.round(num(s.analysisMinutes, 60)))}</p><p class="metric-hint">دقیقه</p></article></div>${next.length ? `<div class="table-wrap"><table><thead><tr><th>نوبت</th><th>تاریخ</th><th>روز</th><th>آزمون</th><th>تحلیل</th><th>وضعیت</th><th>تحلیل مستقل</th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyState('نوبتی در بازهٔ ۶۰ روز آینده نیست', 'چرخه غیرفعال است یا تاریخ شروع گذشتهٔ دور است.')}<div class="advice"><span class="advice-mark">i</span><span>تاریخ رسمی آزمون کنکور ابلاغ نشده؛ بازهٔ ۱۴ روزه انتخاب خودِ شماست و هر وقت خواستید عوض می‌شود. تحلیل نوبت‌های گذشته را حتماً با کد خطا ثبت کنید تا چرخهٔ بعدی قابل مقایسه باشد.</span></div></article>`;
  }

  /**
   * تعارض آزمون/تست با کلاس‌های ثابت و نوبت‌های چرخه.
   *
   * چرا لازم است: آزمون با ساعت مشخص روی تقویم کاربر می‌نشیند. اگر روی
   * کلاس ثابت بیفتد، یکی از دو باید جابه‌جا شود — ولی کلاس ثابت جابه‌جا
   * نمی‌شود، پس هشدار باید پیش از آن لحظه بیاید. آزمون بدون ساعت یا
   * پیش‌نویس بررسی نمی‌شود؛ ادعای تعارض روی دادهٔ ناقص درست نیست.
   */
  function examConflicts() {
    const out = [];
    const exams = (state.attempts || []).filter(a => a.date && a.time && !a.draft);
    for (const a of exams) {
      const wd = weekdayOfIso(a.date);
      const dur = num(a.duration, 0) > 0 ? num(a.duration, 0) : 120;
      const st = minOf(a.time), en = st + dur;
      for (const ev of (state.events || [])) {
        if (Number(ev.weekday) !== wd || ev.recorded || !ev.start || !ev.end) continue;
        if (minOf(ev.start) < en && st < minOf(ev.end)) {
          out.push({ exam: a.name, other: ev.title, date: a.date, day: wd,
            examStart: st, examEnd: en, kind: 'class' });
        }
      }
      // نوبت‌های چرخهٔ آزمون جامع همان روز
      for (const iso of examSeriesOccurrences(state.examSeries, a.date, a.date)) {
        if (iso !== a.date) continue;
        for (const act of (state.activities || []).filter(x => x.examOccurrence === iso)) {
          out.push({ exam: a.name, other: act.title, date: iso, day: wd,
            examStart: st, examEnd: en, kind: 'series' });
        }
      }
    }
    return out;
  }

  // متن هشدار تعارض برای صفحه‌های آزمون
  function examConflictNote() {
    const c = examConflicts();
    if (!c.length) return '';
    const items = c.slice(0, 5).map(x =>
      `${DAYS[x.day]} · ${esc(x.exam)} با ${esc(x.other)}`).join('؛ ');
    return `<div class="advice warning"><span class="advice-mark">!</span><span>${c.length} تعارض زمان‌بندی: ${items}. کلاس ثابت جابه‌جا نمی‌شود؛ یا ساعت آزمون را عوض کن یا آن را به روز دیگری ببر. آزمون‌های بی‌ساعت یا پیش‌نویس بررسی نمی‌شوند.</span></div>`;
  }

  function weekdayOfIso(iso) {
    // شمارهٔ روز هفتهٔ این پروژه: ۰ = شنبه
    const d = new Date(`${iso}T00:00:00Z`);
    return ((d.getUTCDay() + 1) % 7);
  }


  // ---- ماژول منبع و اطمینان در اولویت‌بندی ----
  // چرا لازم است: اولویت‌بندی روی چند عدد ساخته می‌شود. اگر منبع هر عدد
  // دیده نشود و اگر عددِ وارد‌نشده به‌جای «نامشخص» صفر نمایش داده شود،
  // برنامه بر پایهٔ عددی که کسی نگفته برنامه‌ریزی می‌شود.
  //
  // قاعدهٔ صداقت این ماژول:
  //   ۱) «نامشخص» هرگز به صفر تبدیل نمی‌شود؛ صفر یک ادعاست، نه فقدان داده.
  //   ۲) منبع هر عدد قابل دیدن است: رسمی، سوابق، محاسباتی، یا نظر خودتان.
  //   ۳) اطمینان جدا از منبع است؛ منبع رسمی به‌تنهایی اطمینان بالا نمی‌سازد.
  //   ۴) کاربر می‌تواند هر عدد را بازنویسی کند و بازنویسی هم علامت می‌خورد.

  const PRIORITY_SOURCES = {
    official: 'اطلاعیه رسمی',
    historical: 'سوابق آزمون',
    algorithmic: 'محاسباتی از دادهٔ ثبت‌شدهٔ خودت',
    personal: 'نظر یا برآورد خودت',
    unknown: 'بدون منبع'
  };
  const CONFIDENCE_LABELS = {
    high: 'اطمینان بالا',
    medium: 'اطمینان متوسط',
    low: 'اطمینان پایین',
    none: 'بدون اطمینان'
  };
  // ترتیب نمایش برای انتخابگر
  const PRIORITY_SOURCE_ORDER = ['official', 'historical', 'algorithmic', 'personal', 'unknown'];
  const CONFIDENCE_ORDER = ['high', 'medium', 'low', 'none'];

  // فاکتورهای اولویت که منبع و اطمینان دارند
  const PRIORITY_FACTORS = [
    { key: 'estimatedMinutes', label: 'برآورد زمان', unit: 'دقیقه' },
    { key: 'prerequisiteShare', label: 'پیش‌نیاز بودن', unit: '۰ تا ۱' },
    { key: 'finalExamShare', label: 'سهم آزمون نهایی', unit: '۰ تا ۱' }
  ];

  function ensureFactorMeta(topic) {
    if (!topic) return {};
    if (!topic.factorMeta || typeof topic.factorMeta !== 'object') topic.factorMeta = {};
    return topic.factorMeta;
  }

  // وضعیت یک فاکتور: مقدار (یا null اگر نامشخص)، منبع، اطمینان، بازنویسی
  function topicFactor(topic, key) {
    const meta = ensureFactorMeta(topic)[key] || {};
    const raw = topic ? topic[key] : undefined;
    const known = raw !== undefined && raw !== null && raw !== '';
    return {
      key,
      known,
      value: known ? num(raw) : null,
      source: meta.source || (known ? 'personal' : 'unknown'),
      confidence: meta.confidence || (known ? 'low' : 'none'),
      overridden: meta.overridden === true,
      note: meta.note || ''
    };
  }

  function factorValueText(f) {
    if (!f || !f.known) return 'نامشخص';
    if (f.key === 'estimatedMinutes') return fmtMin(f.value);
    return num(f.value).toFixed(1);
  }

  // نشان منبع: رسمی و سوابق متمایز، محاسباتی و نظر شخصی هم متمایز
  function factorSourceBadge(f) {
    if (!f || !f.known) return '<span class="pill warn" title="عدد وارد نشده؛ صفر فرض نشده است">نامشخص</span>';
    const cls = f.source === 'official' ? 'ok' : f.source === 'historical' ? 'ok'
      : f.source === 'algorithmic' ? 'info' : f.source === 'personal' ? '' : 'warn';
    const text = PRIORITY_SOURCES[f.source] || PRIORITY_SOURCES.unknown;
    const ov = f.overridden ? ' · بازنویسی‌شده' : '';
    return `<span class="pill ${cls}" title="منبع: ${esc(text)}${ov ? ' · ' + esc(ov.trim()) : ''}">${esc(text)}${esc(ov)}</span>`;
  }

  function factorConfidenceBadge(f) {
    if (!f || !f.known) return '<span class="pill warn">بدون اطمینان</span>';
    const cls = f.confidence === 'high' ? 'ok' : f.confidence === 'medium' ? 'info'
      : f.confidence === 'low' ? 'warn' : 'warn';
    return `<span class="pill ${cls}">${esc(CONFIDENCE_LABELS[f.confidence] || CONFIDENCE_LABELS.none)}</span>`;
  }

  // ستون‌های منبع و اطمینان برای جدول بانک دروس
  function factorCells(topic) {
    const pre = topicFactor(topic, 'prerequisiteShare');
    const fin = topicFactor(topic, 'finalExamShare');
    return `<td>${factorValueText(pre)}</td><td>${factorSourceBadge(pre)} ${factorConfidenceBadge(pre)}</td><td>${factorValueText(fin)}</td><td>${factorSourceBadge(fin)} ${factorConfidenceBadge(fin)}</td>`;
  }

  // کارت توضیح منبع‌ها بالای جدول: تا کاربر بداند هر برچسب یعنی چه
  function prioritySourcesCard() {
    const rows = PRIORITY_SOURCE_ORDER.map(k => {
      const desc = {
        official: 'عدد از اطلاعیهٔ سازمان سنجش آمده. پرچم‌واره: قابل استناد، ولی برای سال آزمون خودت بازبینی کن.',
        historical: 'از سوابق آزمون‌های گذشته استخراج شده. نسبت به امسال ممکن است جابه‌جا باشد.',
        algorithmic: 'از داده‌ای که خودت وارد کرده‌ای محاسبه شده (مثلاً شواهد عملکرد). ورودی‌اش را می‌بینی.',
        personal: 'نظر یا برآورد خودت است. گاهی تنها منبع موجود است و اشکالی ندارد؛ فقط باید علامت بخورد.',
        unknown: 'منبعی ثبت نشده. عدد نمایش داده نمی‌شود؛ «نامشخص» می‌ماند تا صفرِ جعلی ساخته نشود.'
      }[k];
      return `<tr><td>${esc(PRIORITY_SOURCES[k])}</td><td>${esc(desc)}</td></tr>`;
    }).join('');
    return `<article class="card tone-study"><div class="section-row"><h3 class="card-title">منبع هر عدد کجا می‌آید؟</h3>${actionBtn('فاکتورهای اولویت', 'topic-fields')}</div><p class="card-body">هر عدد اولویت دو برچسب جدا دارد: <strong>منبع</strong> و <strong>اطمینان</strong>. منبع رسمی به‌تنهایی اطمینان بالا نیست؛ اطمینان یعنی چقدر به این عدد برای سال آزمون خودت اعتماد داری. عدد وارد‌نشده «نامشخص» می‌ماند و هرگز به صفر تبدیل نمی‌شود، چون صفر یک ادعاست.</p><div class="table-wrap"><table><thead><tr><th>منبع</th><th>معنا</th></tr></thead><tbody>${rows}</tbody></table></div><div class="advice"><span class="advice-mark">i</span><span>اگر عددی را خودت عوض کردی، برچسب «بازنویسی‌شده» می‌خورد تا در گزارش بعدی مشخص باشد چه چیزی از منبع آمده و چه چیزی نظر توست.</span></div><div class="advice"><span class="advice-mark">i</span><span>ترتیب ترجیحی درس‌ها (ترتیب دلخواه تو) یک <strong>پاداش کوچک</strong> است، حداکثر ${PREFERENCE_MAX_BONUS} واحد و فقط وقتی که دست‌کم دو درس ترتیب داشته باشند. مهلت سخت (+۲) و کار ناقص (+۱) بزرگ‌ترند، پس شاهد واقعی می‌تواند بر ترجیح تو پیشی بگیرد. ترجیح راهنماست، نه قانون.</span></div></article>`;
  }

  function priorityFactorForm(topic) {
    topic = topic || (state.topics || [])[0];
    if (!topic) { notify('ابتدا یک مبحث ثبت کنید'); return; }
    const rows = PRIORITY_FACTORS.map(f => {
      const st = topicFactor(topic, f.key);
      const val = st.known ? (f.key === 'estimatedMinutes' ? Math.round(st.value) : num(st.value)) : '';
      const src = PRIORITY_SOURCE_ORDER.map(k => `<option value="${k}" ${st.source === k ? 'selected' : ''}>${esc(PRIORITY_SOURCES[k])}</option>`).join('');
      const conf = CONFIDENCE_ORDER.map(k => `<option value="${k}" ${st.confidence === k ? 'selected' : ''}>${esc(CONFIDENCE_LABELS[k])}</option>`).join('');
      return `<tr><td>${esc(f.label)}<br><span class="card-body">${esc(f.unit)}</span></td>`
        + `<td><input type="number" name="val_${esc(f.key)}" ${f.key === 'estimatedMinutes' ? 'min="0" step="15"' : 'min="0" max="1" step="0.1"'} value="${val}" placeholder="نامشخص"></td>`
        + `<td><select name="src_${esc(f.key)}">${src}</select></td>`
        + `<td><select name="conf_${esc(f.key)}">${conf}</select></td>`
        + `<td>${esc(st.known ? factorValueText(st) : 'نامشخص')}</td></tr>`;
    }).join('');
    const list = (state.topics || []).map(t => `<option value="${esc(t.id)}" ${t.id === topic.id ? 'selected' : ''}>${esc(t.subjectName || '')} · ${esc(t.name)}</option>`).join('');
    dialog('فاکتورهای اولویت و منبع آن‌ها', `<form id="modalForm"><div class="form-grid"><label>مبحث<select name="topicId">${list}</select></label></div><div class="table-wrap"><table><thead><tr><th>فاکتور</th><th>مقدار (خالی = نامشخص)</th><th>منبع</th><th>اطمینان</th><th>فعلی</th></tr></thead><tbody>${rows}</tbody></table></div><p class="card-body">خالی گذاشتن یک مقدار یعنی «نمی‌دانم». برنامه آن را صفر حساب نمی‌کند؛ «نامشخص» می‌ماند و در گزارش می‌بینید. منبع و اطمینان را هم برای خودتان ثبت کنید تا شش ماه بعد بدانید این عدد از کجا آمده.</p><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیرهٔ فاکتورها</button></div></form>`);
    setModalType('priorityFactors');
  }

  function submitPriorityFactors(form) {
    const d = new FormData(form), v = n => d.get(n);
    const topic = (state.topics || []).find(x => x.id === String(v('topicId') || ''));
    if (!topic) { notify('مبحث را انتخاب کنید'); return; }
    const meta = ensureFactorMeta(topic);
    for (const f of PRIORITY_FACTORS) {
      const raw = v('val_' + f.key);
      const known = raw !== null && raw !== undefined && String(raw).trim() !== '';
      if (known) {
        let n = num(raw);
        n = f.key === 'estimatedMinutes' ? Math.max(0, Math.round(n)) : Math.max(0, Math.min(1, n));
        const prev = topicFactor(topic, f.key);
        const source = String(v('src_' + f.key) || 'personal');
        const confidence = String(v('conf_' + f.key) || 'low');
        meta[f.key] = {
          source, confidence,
          // بازنویسی یعنی عدد با منبع قبلی یکی نبوده
          overridden: prev.known && prev.value !== n,
          note: meta[f.key]?.note || ''
        };
        topic[f.key] = n;
      } else {
        // نامشخص: عدد حذف می‌شود، نه صفر شدن. سابقهٔ منبع می‌ماند.
        topic[f.key] = null;
        meta[f.key] = { ...(meta[f.key] || {}), source: 'unknown', confidence: 'none', overridden: false };
      }
    }
    closeDialog();
    saveAndRender('فاکتورهای اولویت با منبع و اطمینان ذخیره شد');
  }

  /**
   * ترتیب ترجیحی درس‌ها.
   *
   * چرا لازم است: کاربر ترجیح خودش را می‌داند (مثلاً زیست پیش از شیمی پیش
   * از ریاضی). این ترجیح باید در اولویت‌بندی اثر بگذارد، ولی «ترجیح» است
   * نه «قانون»: مهلت سخت، کار ناقص و فوریت واقعی باید بتوانند بر آن پیشی
   * بگیرند. پس اثر آن یک پاداش کوچک و متناسب با رتبه است، نه یک ضریب
   * قدرتمند — و در توضیح اولویت هم همین گفته می‌شود.
   */
  const PREFERENCE_MAX_BONUS = 0.6;

  function subjectPreferenceRank(subjectId) {
    const order = (state.settings && state.settings.subjectOrder) || [];
    const i = order.findIndex(x => x === subjectId);
    return i < 0 ? null : i;
  }

  /** پاداش ترجیح: از بالا به پایین خطی کم می‌شود و به صفر می‌رسد. */
  function preferenceBonus(subjectId) {
    const order = (state.settings && state.settings.subjectOrder) || [];
    const rank = subjectPreferenceRank(subjectId);
    if (rank === null || order.length < 2) return 0;
    return PREFERENCE_MAX_BONUS * (1 - rank / (order.length - 1));
  }

  function priorityOrderForm() {
    const subjects = selectedSubjects();
    if (subjects.length < 2) { notify('برای ترتیب‌دهی حداقل دو درس انتخاب‌شده لازم است'); return; }
    const saved = (state.settings && state.settings.subjectOrder) || [];
    // درس‌هایی که ترتیب ندارند آخر فهرست می‌آیند
    const ordered = [...saved.filter(id => subjects.some(s => s.id === id)),
      ...subjects.map(s => s.id).filter(id => !saved.includes(id))];
    const rows = ordered.map((id, i) => {
      const s = subjects.find(x => x.id === id) || {};
      const bonus = preferenceBonus(id);
      return `<tr><td>${i + 1}</td><td>${esc(s.name || id)}</td>`
        + `<td>${bonus > 0 ? bonus.toFixed(2) : '—'}</td>`
        + `<td><input type="number" name="rank_${esc(id)}" min="1" max="${subjects.length}" value="${i + 1}"></td></tr>`;
    }).join('');
    dialog('ترتیب ترجیحی درس‌ها', `<form id="modalForm"><p class="card-body">ترتیبی که اینجا می‌بندی یک <strong>ترجیح</strong> است، نه قانون. اثر آن یک پاداش کوچک (حداکثر ${PREFERENCE_MAX_BONUS} واحد) است که از رتبهٔ اول به آخر کم می‌شود؛ مهلت سخت، کار ناقص و فوریت واقعی می‌توانند بر آن پیشی بگیرند. اگر می‌خواهی یک درس کاملاً جلو بیافتد، وزن شخصی‌اش را در تنظیمات بالا ببر.</p><div class="table-wrap"><table><thead><tr><th>رتبه</th><th>درس</th><th>پاداش فعلی</th><th>رتبهٔ تازه</th></tr></thead><tbody>${rows}</tbody></table></div><p class="card-body">رتبه‌ها باید یکتا باشند؛ اگر دو درس یک عدد بگیرند، ترتیب قبلی برای همان‌ها حفظ می‌شود.</p><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیرهٔ ترتیب</button></div></form>`);
    setModalType('priorityOrder');
  }

  function submitPriorityOrder(form) {
    const d = new FormData(form), v = n => d.get(n);
    const subjects = selectedSubjects();
    const pairs = subjects.map(s => {
      const raw = v('rank_' + s.id);
      const n = raw === null || raw === undefined || String(raw).trim() === '' ? null : Math.round(num(raw));
      return { id: s.id, rank: n };
    }).filter(p => p.rank !== null);
    if (!pairs.length) { notify('حداقل برای یک درس رتبه بده'); return; }
    pairs.sort((a, b) => a.rank - b.rank);
    state.settings.subjectOrder = pairs.map(p => p.id);
    closeDialog();
    saveAndRender(`ترتیب ترجیحی ${pairs.length} درس ذخیره شد؛ اثر آن پاداش کوچکی است نه قانون`);
  }


  function addActivityForm(a=null){dialog(a?'ویرایش فعالیت':'افزودن فعالیت',`<form id="modalForm"><label>عنوان فعالیت<input name="title" required value="${esc(a?.title||'')}"></label><div class="form-grid"><label>نوع<select name="type">${Object.entries(ACT_TYPES).map(([k,v])=>`<option value="${k}" ${a?.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label>درس<select name="subject">${subjectOptions()}</select></label><label>برآورد (دقیقه)<input type="number" name="estimate" min="1" max="600" value="${num(a?.estimate,45)}" required></label><label>حداقل بخش<input type="number" name="minChunk" min="5" max="120" value="${num(a?.minChunk,20)}"></label><label>حداکثر بخش<input type="number" name="maxChunk" min="10" max="180" value="${num(a?.maxChunk,90)}"></label><label>مهلت<select name="deadline"><option value="none">بدون مهلت</option><option value="soft" ${a?.deadline==='soft'?'selected':''}>نرم</option><option value="hard" ${a?.deadline==='hard'?'selected':''}>سخت</option></select></label><label>تاریخ مهلت<input type="date" name="deadlineDate" value="${esc(a?.deadlineDate||'')}"></label><label>وزن شخصی (۰٫۵ تا ۲)<input type="number" name="weight" min="0.5" max="2" step="0.1" value="${num(a?.personalWeight,1)}"></label><label class="check-label"><input type="checkbox" name="splittable" ${a?.splittable!==false?'checked':''}> قابل تقسیم</label></div><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیره فعالیت</button></div></form>`);if(a){$('#modalForm').dataset.edit=a.id;$('#modalForm [name=subject]').value=a.subjectId||''}setModalType('activity')}
  function addExamForm(a=null){dialog(a?'ویرایش نوبت آزمون':'ثبت نوبت آزمون',`<form id="modalForm"><label>نام آزمون<input name="name" required value="${esc(a?.name||'')}"></label><div class="form-grid"><label>نوع<select name="kind">${Object.entries(EXAM_KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>درس<select name="subject">${subjectOptions()}</select></label><label>تاریخ<input type="date" name="date" value="${todayISO()}" required></label><label>ساعت شروع (برای تشخیص تعارض)<input type="time" name="time" value="${esc(a?.time||'')}" placeholder="اختیاری"></label><label>کل سؤال<input type="number" name="total" min="1" max="500" placeholder="خالی = پیش‌نویس"></label><label>درست<input type="number" name="correct" min="0" value="${a?.correct ?? 0}" placeholder="خالی = ۰"></label><label>غلط<input type="number" name="wrong" min="0" value="${a?.wrong ?? 0}" placeholder="خالی = ۰"></label><label>نزده<input type="number" name="blank" min="0" value="${a?.blank ?? 0}" placeholder="خالی = ۰"></label><label>مدت (دقیقه)<input type="number" name="duration" min="0" value="${a?.duration ?? 0}"></label><label>کد خطا<select name="error"><option value="">ثبت نشده</option>${Object.entries(ERRORS).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('')}</select></label><label>یادداشت<textarea name="note"></textarea></label></div><label>پیوست نتیجهٔ آزمون (اختیاری)<input type="file" name="attachment" accept="image/*,.pdf,.txt,.csv"></label><p class="card-body">برنامه تصویر را <strong>نمی‌خوانَد</strong>؛ فقط نام و حجم فایل به‌عنوان منبع اعدادی که خودت وارد کرده‌ای ثبت می‌شود. در نسخهٔ دسکتاپ فایل در پوشهٔ محلی برنامه کپی می‌شود.</p><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ثبت آزمون</button></div></form>`);setModalType('exam')}
  function addReviewForm(){dialog('افزودن مورد مرور',`<form id="modalForm"><label>عنوان مورد<input name="label" required></label><div class="form-grid"><label>درس<select name="subject">${subjectOptions()}</select></label><label>مبحث مرتبط (اختیاری)<select name="topicId"><option value="">بدون اتصال</option>${(state.topics||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.subjectName)} · ${esc(t.name)}</option>`).join('')}</select></label><label>نوع<select name="type"><option>مفهومی</option><option>حفظی</option><option>محاسباتی</option><option>واژگانی</option><option>نموداری</option></select></label><label>موعد<input type="date" name="due" value="${todayISO()}"></label><label>دشواری ۱ تا ۵<input type="number" name="difficulty" min="1" max="5" value="3"></label><label>یادداشت<textarea name="content"></textarea></label></div><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیره</button></div></form>`);setModalType('review')}
  function eventForm(e=null){dialog(e?'ویرایش رویداد':'افزودن کلاس یا تعهد',`<form id="modalForm"><label>عنوان<input name="title" required value="${esc(e?.title||'')}"></label><div class="form-grid"><label>نوع<select name="kind">${Object.entries(EVENT_KINDS).map(([k,v])=>`<option value="${k}" ${e?.kind===k?'selected':''}>${v}</option>`).join('')}</select></label>${weekdaySelect('weekday',e?.weekday??weekday())}<label>درس<select name="subject">${subjectOptions()}</select></label>${timeInputs(e?.start||'09:00',e?.end||'10:00')}<label class="check-label"><input name="recorded" type="checkbox" ${e?.recorded?'checked':''}> ضبط‌شده/غیرهم‌زمان</label><label>یادداشت<input name="note" value="${esc(e?.note||'')}"></label></div><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیره</button></div></form>`);if(e){$('#modalForm').dataset.edit=e.id;$('#modalForm [name=subject]').value=e.subjectId||''}setModalType('event')}
  function routineForm(r=null){dialog(r?'ویرایش روال':'افزودن روال ثابت',`<form id="modalForm"><label>عنوان روال<input name="title" required value="${esc(r?.title||'')}"></label><div class="form-grid"><label>نوع<select name="kind">${Object.entries(ROUTINE_KINDS).map(([k,v])=>`<option value="${k}" ${r?.kind===k?'selected':''}>${v}</option>`).join('')}</select></label>${timeInputs(r?.start||'12:00',r?.end||'12:30')}<label>تکرار<select name="repeat"><option value="daily">روزانه</option><option value="alternate" ${r?.repeat==='alternate'?'selected':''}>یک‌روزدرمیان</option></select></label><fieldset class="day-picker"><legend>روزهای تکرار</legend>${DAYS.map((d,i)=>`<label><input type="checkbox" name="days" value="${i}" ${(r?.days||[0,1,2,3,4,5,6]).includes(i)?'checked':''}>${d}</label>`).join('')}</fieldset></div><div class="modal-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn primary" type="submit">ذخیره روال</button></div></form>`);if(r)$('#modalForm').dataset.edit=r.id;setModalType('routine')}
  // ---- راه‌اندازی: گام‌های جمع‌وجور ----
  // مرجع نیازمندی‌ها: docs/USER_SCHEDULE_AND_ONBOARDING.md §3،
  // docs/MASTER_PRODUCT_BLUEPRINT.md بخش A و UNIFIED_REQUIREMENTS_CATALOG.md
  // (ONB-01..05، EST-02). هیچ گامی دادهٔ نمونه نیست؛ عدد پیش‌فرض فرضیهٔ قابل
  // تنظیم است و تعارض فقط از رویداد واقعی کاربر ساخته می‌شود (D-023).
  const SETUP_TITLES = ['پروفایل آزمون', 'درس و کتاب', 'کلاس‌ها و تعهدات',
    'خواب، غذا و روال‌ها', 'آزمون جامع', 'سطح مبحثی و برآورد زمان',
    'اولویت و تأیید نهایی'];
  const SETUP_TOTAL = SETUP_TITLES.length;
  // گام‌های اختیاری قابل رد کردن‌اند؛ بقیه بدون پاسخ جلو نمی‌روند.
  const SETUP_OPTIONAL = [false, false, false, false, true, true, false];
  const ESTIMATE_DEFAULT_KEYS = [
    ['testing', 'تست زمان‌دار'], ['analysis', 'تحلیل تست'],
    ['consolidation', 'تثبیت'], ['homework', 'تکلیف'], ['review', 'مرور فعال']];

  /** تعارض واقعی بین رویدادهایی که خود کاربر در همین راه‌اندازی وارد کرده. */
  function setupConflicts() {
    const o = state.onboarding.values || {};
    const items = [];
    (o.attend === 'yes' ? (o.classes || []) : []).forEach((e, i) => items.push({ e, i, key: 'class' }));
    (o.commitments || []).forEach((e, i) => items.push({ e, i, key: 'commitment' }));
    const live = items.filter(x => !x.e.recorded);
    const hits = [];
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const x = live[i], y = live[j];
        if (x.e.weekday === y.e.weekday && minOf(x.e.start) < minOf(y.e.end)
          && minOf(y.e.start) < minOf(x.e.end)) hits.push({ x, y });
      }
    }
    return hits;
  }

  /** بلوک پرسش تعارض: کدام‌یک ضبط‌شده/غیرهم‌زمان است؟ */
  function setupConflictBlock() {
    const hits = setupConflicts();
    if (!hits.length) return '';
    const rows = hits.map(({ x, y }) => {
      const day = DAYS[x.e.weekday];
      const label = (it) => esc(it.e.title) + ' ' + esc(it.e.start) + '–' + esc(it.e.end);
      return `<li>${day}: ${label(x)} با ${label(y)} هم‌پوشانی دارد.</li>`;
    }).join('');
    const marks = hits.map(({ x, y }) =>
      `${actionBtn('«' + esc(x.e.title) + '» ضبط‌شده است', 'wizard-recorded:' + x.key + ':' + x.i)}
       ${actionBtn('«' + esc(y.e.title) + '» ضبط‌شده است', 'wizard-recorded:' + y.key + ':' + y.i)}`
    ).join('');
    return `<div class="advice warning"><span class="advice-mark">!</span><span>
      <strong>تعارض حل‌نشده.</strong> ${rows}<br>
      کدام‌یک ضبط‌شده/غیرهم‌زمان است؟ با علامت‌زدن آن، بازه آزاد می‌شود و برنامه
      قطعی ساخته می‌شود. تا حل این تعارض، پایان راه‌اندازی باز است.<br>${marks}</span></div>`;
  }

  function setupPage() {
    const o = state.onboarding.values || {}, step = num(state.onboarding.step),
      group = o.group || profileGroup(), catalog = window.K2_CATALOG || {},

    if (step === 0) body = `<div class="form-grid">`
      + `<label>نام پروفایل<input data-flow="name" value="${esc(o.name || state.profile?.name || '')}" placeholder="اختیاری"></label>`
      + `<label>رشته<select data-flow="group"><option value="">انتخاب رشته</option>${Object.keys(catalog).map(g => `<option value="${esc(g)}" ${g === group ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>`
      + `<label>سال آزمون<input data-flow="year" value="${esc(o.year || state.profile?.year || '۱۴۰۶')}"></label>`
      + `<label>نام آزمون<input data-flow="examName" value="${esc(o.examName || state.profile?.examName || 'کنکور سراسری')}"></label>`
      + `<label>تاریخ آزمون<input type="date" data-flow="date" value="${esc(o.date || state.profile?.date || '')}"></label>`
      + `<label>وضعیت تاریخ<select data-flow="dateStatus"><option value="unknown">نامشخص</option><option value="official" ${o.dateStatus === 'official' ? 'selected' : ''}>رسمی با منبع</option><option value="estimated" ${o.dateStatus === 'estimated' ? 'selected' : ''}>تخمینی</option></select></label>`
      + `<label>منبع تاریخ<input data-flow="source" value="${esc(o.source || '')}" placeholder="در حالت «رسمی» لازم است"></label>`

        body = `<p class="card-body">${esc(shareNote)}</p>`

          + `<div class="setup-course-list">` + courses.map(c => {
            const key = group + '|' + c.name, sel = (o.subjects || []).includes(key);

              + `<span class="pill ${c.examCoefficient !== null ? 'info' : 'gray'}">${esc(c.type)}${c.examCoefficient !== null ? ' · ضریب آزمون ' + c.examCoefficient : ' · ضریب تک‌درس نامشخص'}</span>`
              + `</label><div class="book-list">` + c.books.map(b => {
                const bk = key + '|' + b.code, checked = (o.books || []).includes(bk);
                return `<label class="book-row"><input type="checkbox" data-book="${esc(bk)}" ${checked ? 'checked' : ''}><span>${esc(b.title)} · پایهٔ ${b.grade} · کد ${esc(b.code)}</span></label>`;
              }).join('') + `</div></article>`;
          }).join('') + `</div>`
          + `<div class="advice"><span class="advice-mark">i</span><span>دروس عمومی دفترچهٔ آزمون اختصاصی نیستند؛ اثر آن‌ها از مسیر سوابق تحصیلی است. منبع اعداد آزمون، بازنشر متن اطلاعیه است.</span></div>`;
      }
    }
    else if (step === 2) {
      body = `<p class="card-body">اگر کلاس کنکوری مؤسسه دارید، جلسه‌ها را وارد کنید. رویداد ضبط‌شده غیرهم‌زمان است و در همان بازه ظرفیت نمی‌گیرد.</p>`
        + `<div class="button-row"><label class="setup-inline"><input type="radio" name="attend" data-flow="attend" value="yes" ${o.attend === 'yes' ? 'checked' : ''}> کلاس دارم</label>`
        + `<label class="setup-inline"><input type="radio" name="attend" data-flow="attend" value="no" ${o.attend === 'no' ? 'checked' : ''}> کلاس ندارم</label></div>`
        + (o.attend === 'yes'
          ? `<div class="button-row">${actionBtn('＋ افزودن جلسه', 'wizard-add-class')}</div>`
            + ((o.classes || []).map((e, i) => `<div class="list-row"><span>${DAYS[e.weekday]} ${esc(e.start)}–${esc(e.end)} · ${esc(e.title)}${e.subjectName ? ' · ' + esc(e.subjectName) : ''}${e.recorded ? ' · ضبط‌شده' : ''}</span><span>${actionBtn('حذف', 'wizard-delete-class:' + i, 'danger')}</span></div>`).join('') || '<p class="card-body">جلسه‌ای ثبت نشده است.</p>')

    else if (step === 3) {
      body = `<div class="form-grid">`
        + `<label>بیداری<input type="time" data-flow="wake" value="${esc(o.wake || state.settings.wake)}"></label>`

        + `<label>حداقل خواب مورد نظر (دقیقه)<input type="number" min="180" max="720" step="15" data-flow="sleepTarget" value="${esc(o.sleepTarget ?? num(state.settings.sleepTargetMinutes, 480))}"></label>`

        + `<label>ساعت‌های پربازده<input data-flow="peak" value="${esc(o.peak || '')}" placeholder="۱۶:۰۰–۱۸:۰۰"></label>`

        + `<div class="button-row">${actionBtn('＋ افزودن روال', 'wizard-add-routine')}</div>`

        + `<label>مدت خودِ آزمون (دقیقه)<input type="number" min="15" max="600" data-flow="examDuration" value="${Math.round(num(s.durationMinutes, 210))}"></label>`

        + setupConflictBlock()

    // تهی تولید می‌شد و با space-between فاصلهٔ مرده و دکمهٔ سرریخته می‌ساخت.
    const navButtons = [];

  function nightlyReviewDialog(){const today=todayISO();const done=(state.activities||[]).filter(a=>a.state==='done');const incomplete=(state.activities||[]).filter(a=>a.state==='partial'||a.state==='overdue');const better=(state.activities||[]).filter(a=>a.state==='done'&&num(a.actual)>0&&num(a.actual)<num(a.estimate));const worse=(state.activities||[]).filter(a=>a.state==='done'&&num(a.actual)>num(a.estimate));const sess=sessionTotals(sessionsBetween(today,today));const plan=makePlan();const planned=plan.placements.reduce((n,x)=>n+x.minutes,0);const risks=(state.deadlines||[]).filter(d=>d.kind==='final_consolidation');const lines=[`امروز ${fmtMin(sess.total)} از ${fmtMin(planned)} دقیقهٔ برنامه اجرا شد (${planned?Math.round(sess.total/planned*100):0}٪).`,`از این تعداد، ${fmtMin(sess.cls)} کلاس و ${fmtMin(sess.independent)} مطالعهٔ مستقل بود.`];if(incomplete.length)lines.push('ناقص مانده: '+incomplete.slice(0,5).map(a=>a.title).join('؛ '));if(better.length)lines.push('بهتر از برآورد: '+better.slice(0,3).map(a=>a.title).join('؛ '));if(worse.length)lines.push('بدتر از برآورد: '+worse.slice(0,3).map(a=>a.title).join('؛ '));for(const d of risks.slice(0,4)){const t=(state.topics||[]).find(x=>x.id===d.topicId);const planD=t?backCalculate(t):null;if(planD&&!planD.feasible)lines.push(`ریسک مهلت: ${t.name} — برای رسیدن باید ${planD.lateDays} روز پیش‌تر شروع می‌شد.`)}lines.push('کلاس‌ها و تعهدهای ثابت دست‌نخورده می‌مانند؛ کار ناقص با سنجش اهمیت و فوریت بین روزهای باز توزیع می‌شود.');dialog('بازبینی و بازسازی شبانه',`<div class="advice"><span class="advice-mark">✓</span><span>${lines.map(esc).join('<br>')}</span></div><article class="card"><h3 class="card-title">چرا بازسازی، نه انتقال خودکار؟</h3><p class="card-body">انتقال کورکورانهٔ کار ناقص به فردا باعث انباشت می‌شود. ابتدا اهمیت و فوریت سنجیده می‌شود؛ اگر کار مهم نیست یا مهلتش رفته، تعویق یا حذف با دلیل ثبت می‌شود.</p></article><div class="modal-actions"><button class="btn" type="button" data-action="refresh-plan">بازسازی   const SESSION_KINDS={independent:'مطالعهٔ مستقل',live_class:'کلاس حضوری/آنلاین',recorded_class:'کلاس ضبط‌شده',test:'تست/آزمون',analysis:'تحلیل تست',review:'مرور',consolidation:'تثبیت',homework:'تکلیف'};
  const KONKUR_STAGES=['مطالعهٔ مفهومی','تست تدریس','تست زمان‌دار','تحلیل گزینه‌ها','مرور خطاها','آزمون ترکیبی'];
  const FINAL_STAGES=['مطالعهٔ دقیق کتاب','تعریف‌ها و روابط','جزئیات و نقشهٔ محتوا','تمرین تشریحی','سؤال‌های نمونهٔ معتبر','بررسی کامل‌بودن و نشانه‌گذاری','آزمون جامع نهایی'];
  const DEADLINE_KINDS={start:'مهلت شروع',initial_learning:'مهلت یادگیری اولیه',practice:'مهلت تمرین/تست',final_consolidation:'مهلت تثبیت نهایی'};
  const PROBLEM_KINDS={conceptual_gap:'شکاف مفهومی',accuracy:'بی‌دقتی',speed:'کندی/کمبود زمان',retention:'فراموشی زودرس',exam_stress:'استرس آزمون',method:'ضعف روش حل'};

  const stageOf=topic=>topic?.stages||{konkur:0,final:0};
  const stageLabel=(track,i)=>((track==='konkur'?KONKUR_STAGES:FINAL_STAGES)[Math.max(0,Math.min(i,(track==='konkur'?KONKUR_STAGES:FINAL_STAGES).length-1))]);
  const stageProgress=(track,i)=>{const n=(track==='konkur'?KONKUR_STAGES:FINAL_STAGES).length;return Math.round((Math.min(i,n-1)/(n-1))*100)};

  // ---- جمع‌بندی جلسه‌های مطالعه ----
  function sessionsBetween(fromISO,toISO){return (state.sessions||[]).filter(s=>s.date>=fromISO&&s.date<=toISO)}
  function sessionTotals(list){const t={total:0,cls:0,independent:0,test:0,analysis:0,review:0,count:0,break:0};for(const s of list){t.total+=num(s.minutes);t.break+=num(s.breakMinutes);t.count++;if(s.kind==='live_class'||s.kind==='recorded_class')t.cls+=num(s.minutes);else t.independent+=num(s.minutes);if(s.kind==='test')t.test+=num(s.minutes);if(s.kind==='analysis')t.analysis+=num(s.minutes);if(s.kind==='review')t.review+=num(s.minutes)}return t}
  function weekDates(){const out=[];const base=new Date();for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()-((base.getDay()+1)%7)+i);out.push(d.toISOString().slice(0,10))}return out}

  // ---- مهلت: بازمحاسبه از تاریخ تثبیت نهایی ----
  function backCalculate(topic){const master=(state.deadlines||[]).filter(d=>d.topicId===topic.id&&d.kind==='final_consolidation').sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];if(!master)return null;const total=num(topic.estimatedMinutes)||0;const perDay=Math.max(30,Math.round(Math.max(0,minOf(state.settings.sleep)-minOf(state.settings.wake))*.55));const days=total?Math.max(1,Math.ceil(total/perDay)):1;const cons=new Date(master.date);const practice=new Date(cons);practice.setDate(cons.getDate()-Math.max(1,Math.ceil(days*.3))-1);const initial=new Date(practice);initial.setDate(practice.getDate()-Math.max(1,Math.ceil(days*.5))-1);const start=new Date(initial);start.setDate(initial.getDate()-Math.max(1,Math.ceil(days*.5))-1);const today=new Date(todayISO());const startISO=start.toISOString().slice(0,10);const lateDays=Math.max(0,Math.round((today-new Date(startISO))/864e5));return{master,total,perDay,days,consolidation:master.date,practice:practice.toISOString().slice(0,10),initial:initial.toISOString().slice(0,10),start:startISO,lateDays,feasible:lateDays<=0}}
  function feasibilityNote(plan){if(!plan)return{text:'برای این مبحث مهلت تثبیت نهایی ثبت نشده؛ بازمحاسبه ممکن نیست.',level:'info'};if(!plan.total)return{text:'زمان برآوردی این مبحث ثبت نشده؛ بدون آن امکان‌سنجی معنا ندارد.',level:'info'};if(plan.feasible)return{text:`با ظرفیت حدود ${fmtMin(plan.perDay)} در روز، این مسیر شدنی است: ${plan.days} روز کار لازم است.`,level:'ok'};return{text:`برای رسیدن به این مهلت باید ${plan.lateDays} روز پیش‌تر شروع می‌شدی. سه گزار هست: زمان بیشتر، حجم کمتر، یا جابه‌جایی مهلت. اولویت‌بندی تنها گزینهٔ درست نیست، چون مبحث سخت بودن دلیل حذفشدن نیست.`,level:'warn'}}

  // ---- تایمر واقعی ----
  function timerElapsedSeconds(){const t=state.timer;if(!t||!t.startedAt)return Math.round(num(t.accumulated));const now=Date.now();const run=t.paused?0:(now-Date.parse(t.startedAt))/1000;return Math.round(num(t.accumulated)+run)}
  function timerDisplay(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
  function timerStart(){const t=state.timer;if(t.running)return;t.running=true;t.paused=false;t.startedAt=new Date().toISOString();t.accumulated=0;persist('تایمر شروع شد')}
  function timerPause(){const t=state.timer;if(!t.running)return;if(!t.paused){t.accumulated=timerElapsedSeconds();t.paused=true;t.pausedAt=new Date().toISOString()}else{t.paused=false;t.startedAt=new Date().toISOString();t.pausedAt=null}persist(t.paused?'استراحت ثبت شد':'تایمر ادامه یافت')}
  function timerStop(){const t=state.timer;if(!t.running)return;const net=Math.max(0,Math.round(timerElapsedSeconds()/60));const gross=Math.max(net,Math.round((num(t.accumulated)+(t.paused?0:(Date.now()-Date.parse(t.startedAt))/1000))/60));state.sessions=state.sessions||[];state.sessions.unshift({id:id(),date:todayISO(),startedAt:t.startedAt,endedAt:new Date().toISOString(),kind:t.kind||'independent',topicId:t.topicId||null,minutes:net,breakMinutes:Math.max(0,gross-net),mode:'timer'});state.timer={running:false,paused:false,startedAt:null,accumulated:0,pausedAt:null,kind:t.kind,topicId:t.topicId};persist(`جلسه ثبت شد · ${fmtMin(net)} خالص`)}

  // ---- صفحهٔ مهلت‌های من ----
  function deadlinesPage(){const topics=state.topics||[];const rows=topics.map(topic=>{const plan=backCalculate(topic);const note=feasibilityNote(plan);return `<tr><td>${esc(topic.name)}</td><td>${esc(topic.subjectName||'—')}</td><td>${plan?esc(plan.consolidation):'—'}</td><td>${plan?fmtMin(plan.total):'—'}</td><td>${plan?fmtMin(plan.perDay):'—'}</td><td>${plan?esc(plan.start):'—'}</td><td class="${note.level==='warn'?'danger':''}">${note.level==='warn'?'در خطر':'شدنی'}</td></tr>`}).join('');const infeasible=topics.map(topic=>({topic,plan:backCalculate(topic)})).filter(x=>x.plan&&!x.plan.feasible);return `<div class="page-scroll">${pageHeader('مهلت‌های من','مهلت تثبیت نهایی مادر است؛ برنامه از آن به عقب برمی‌گردد',actionBtn('＋ ثبت مهلت','add-deadline','primary'))}${topics.length?`<div class="table-wrap"><table><thead><tr><th>مبحث</th><th>درس</th><th>مهلت تثبیت نهایی</th><th>جمع زمان لازم</th><th>ظرفیت روزانه</th><th>شروع لازم</th><th>وضعیت</th></tr></thead><tbody>${rows}</tbody></table></div>${infeasible.length?`<div class="advice warning"><span class="advice-mark">!</span><span>${infeasible.length} مهلت با ظرفیت فعلی در خطر است. برای هر کدام یکی از چهار راه را انتخاب کن: زمان بیشتر، حجم کمتر، بازبینی اولویت، یا جابه‌جایی مهلت. تصمیم با خودت است و دلیلش ثبت می‌شود.</span></div>`:'<div class="advice"><span class="advice-mark">✓</span><span>همهٔ مهلت‌ها با ظرفیت فعلی شدنی‌اند.</span></div>'}`:emptyState('موردی برای بازمحاسبه نیست','ابتدا در «بانک دروس» مبحث و زمان برآوردی ثبت کن.',actionBtn('رفتن به بانک دروس','go-courses'))}<article class="card tone-deadline"><h3 class="card-title">تکمیل مهلت با شاهد، نه تیک تقویم</h3><p class="card-body">یک مبحث «تمام‌شده» نیست چون تاریخ گذشته؛ تمام‌شده است وقتی شاهد عملکردی تأییدکنندهٔ هدف درصد/سطح ثبت شده باشد. تا آن زمان در فهرست باز می‌ماند.</p></article><div class="advice"><span class="advice-mark">i</span><span>ظرفیت روزانه از تنظیمات خواب/بیداری با ضریب تمرکز تخمین زده می‌شود؛ آستانه‌ها فرضیهٔ محصول [H] و در نسخهٔ دسکتاپ قابل   // ---- صفحهٔ ساعت مطالعه ----
  function timerPage(){const t=state.timer||{};const week=weekDates();const todaySessions=sessionsBetween(todayISO(),todayISO());const weekSessions=sessionsBetween(week[0],week[6]);const day=sessionTotals(todaySessions),wk=sessionTotals(weekSessions);const plan=makePlan();const planned=plan.placements.reduce((n,x)=>n+x.minutes,0);const ratio=planned?Math.min(999,Math.round(day.total/planned*100)):0;const rows=(state.sessions||[]).slice(0,40).map(s=>`<tr><td>${esc(s.date)}</td><td>${SESSION_KINDS[s.kind]||s.kind}</td><td>${esc((state.topics||[]).find(x=>x.id===s.topicId)?.name||'—')}</td><td>${fmtMin(s.minutes)}</td><td>${fmtMin(s.breakMinutes)}</td><td>${s.mode==='timer'?'تایمر':s.mode==='corrected'?'اصلاح‌شده':'دستی'}</td><td>${esc(s.note||'—')}</td></tr>`).join('');return `<div class="page-scroll">${pageHeader('ساعت مطالعه','تایمر واقعی، جمع خالص و مقایسه با برنامه',actionBtn('＋ ثبت دستی','add-session'))}<article class="card tone-timer"><div class="section-row"><h3 class="card-title">تایمر</h3><span class="pill info">${t.running?(t.paused?'استراحت':'در حال اندازه‌گیری'):'آماده'}</span></div><p class="metric-value" id="timerClock">${timerDisplay(timerElapsedSeconds())}</p><form id="timerForm" class="form-grid"><label>نوع جلسه<select name="kind">${Object.entries(SESSION_KINDS).map(([k,v])=>`<option value="${k}" ${t.kind===k?'selected':''}>${v}</option>`).join('')}</select></label><label>مبحث<select name="topicId"><option value="">— بدون مبحث —</option>${(state.topics||[]).map(x=>`<option value="${esc(x.id)}" ${t.topicId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></form><div class="button-row">${t.running?'':actionBtn('شروع','timer-start','primary')}${t.running?actionBtn(t.paused?'ادامه':'استراحت','timer-pause'):''}${t.running?actionBtn('پایان و ثبت','timer-stop','primary'):''}</div><p class="card-body">زمان استراحت از دقیقهٔ خالص کم می‌شود و کلاس جدا از مطالعهٔ مستقل شمرده می‌شود تا ساعت درس، ساعت مطالعهٔ شخصی‌ات را پنهان نکند.</p></article><div class="metrics"><article class="metric tone-timer"><p class="metric-label">امروز</p><p class="metric-value">${fmtMin(day.total)}</p><p class="metric-hint">کلاس ${fmtMin(day.cls)} · مستقل ${fmtMin(day.independent)}</p></article><article class="metric tone-timer"><p class="metric-label">این هفته</p><p class="metric-value">${fmtMin(wk.total)}</p><p class="metric-hint">${wk.count} جلسه · مستقل ${fmtMin(wk.independent)}</p></article><article class="metric tone-study"><p class="metric-label">برنامه در مقابل اجرا</p><p class="metric-value">${ratio}٪</p><p class="metric-hint">برنامه ${fmtMin(planned)} · اجرا ${fmtMin(day.total)}</p></article></div><article class="card tone-timer"><h3 class="card-title">جلسه‌های ثبت‌شده</h3>${(state.sessions||[]).length?`<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>مبحث</th><th>خالص</th><th>استراحت</th><th>ثبت</th><th>یادداشت</th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyState('جلسه‌ای ثبت نشده','تایمر را شروع کن یا یک جلسهٔ گذشته را دستی ثبت کن.')}</article></div>`}

  function problemsPage(){const rows=(state.problems||[]).map(p=>`<tr><td>${esc(p.title)}</td><td>${PROBLEM_KINDS[p.kind]||p.kind}</td><td>${esc((state.topics||[]).find(x=>x.id===p.topicId)?.name||'—')}</td><td>${esc(p.severity)}</td><td>${PROBLEM_STATUS[p.status]||p.status}</td><td>${esc(p.firstSeen||'—')}</td><td>${actionBtn('اقدام','problem-act:'+p.id)}</td></tr>`).join('');const open=(state.problems||[]).filter(p=>p.status!=='resolved');const severe=open.filter(p=>num(p.severity)>=4);return `<div class="page-scroll">${pageHeader('مشکلات یادگیری','ثبت، پیگیری و رفع؛ شدت خودگزارشی است نه نمره',actionBtn('＋ ثبت مشکل','add-problem','primary'))}${(state.problems||[]).length?`<div class="table-wrap"><table><thead><tr><th>عنوان</th><th>نوع</th><th>مبحث</th><th>شدت</th><th>وضعیت</th><th>اولین ظهور</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${severe.length?`<div class="advice warning"><span class="advice-mark">!</span><span>${severe.length} مشکل شدید باز داری. این‌ها در اولویت‌بندی و بازبینی شبانه دیده می‌شوند؛ مبحث را به‌خاطر مشکل حذف نمی‌کنیم، روشش را عوض می‌کنیم.</span></div>`:''}`:emptyState('مشکلی ثبت نشده','مشکل یادگیری را خودت تشخیص می‌دهی: شکاف مفهومی، بی‌دقتی، کندی، فراموشی زودرس یا استرس آزمون.',actionBtn('ثبت مشکل','add-problem','primary'))}<article class="card tone-problem"><h3 class="card-title">چرا این بخش جدا از آزمون است؟</h3><p class="card-body">خطای آزمون یک رویداد است؛ مشکل یادگیری یک الگو. الگو فقط با پیگیری دیده می‌شود: چه اتفاقی افتاد، چه کاری شد، نتیجه چه بود. همین تاریخچه است که در بازبینی شبانه تصمیم را عوض می‌کند.</p></article></div>`}

  // ---- صفحهٔ کلاس‌های من ----
  function classesPage(){const events=(state.events||[]).map(e=>`<tr><td>${esc(e.title)}</td><td>${EVENT_KINDS[e.kind]||e.kind}</td><td>${DAYS[e.weekday]}</td><td>${esc(e.start)}–${esc(e.end)}</td><td>${e.recorded?'بله':'خیر'} ${eventConfirmBadge(e)}</td><td>${esc(e.subjectName||'—')}</td></tr>`).join('');const routines=(state.routines||[]).map(r=>`<tr><td>${esc(r.title)}</td><td>${ROUTINE_KINDS[r.kind]||r.kind}</td><td>${esc(r.start)}–${esc(r.end)}</td><td>${(r.days||[]).map(d=>DAYS[d]).join('، ')}</td></tr>`).join('');const totalClass=(state.events||[]).reduce((n,e)=>n+(minOf(e.end)-minOf(e.start)),0);const totalRoutine=(state.routines||[]).reduce((n,r)=>n+(minOf(r.end)-minOf(r.start)),0);const conflicts=detectConflicts();return `<div class="page-scroll">${pageHeader('کلاس‌های من','ورودی ظرفیت واقعی؛ این بلوک‌ها هرگز جابه‌جا نمی‌شوند',`${actionBtn('＋ کلاس/تعهد','add-event','primary')}${actionBtn('＋ روال ضروری','add-routine')}${(state.events||[]).length?'':actionBtn('افزودن کلاس‌های ثابت اولیه','seed-classes')}`)}<div class="metrics"><article class="metric tone-class"><p class="metric-label">رویداد ثابت</p><p class="metric-value">${(state.events||[]).length}</p><p class="metric-hint">${fmtMin(totalClass)} در هفته</p></article><article class="metric tone-class"><p class="metric-label">روال ضروری</p><p class="metric-value">${(state.routines||[]).length}</p><p class="metric-hint">${fmtMin(totalRoutine)} در روز</p></article><article class="metric tone-warn"><p class="metric-label">تعارض</p><p class="metric-value">${conflicts.length}</p><p class="metric-hint">پیش از برنامه‌ریزی بررسی می‌شود</p></article></div><article class="card tone-class"><h3 class="card-title">رویدادهای ثابت هفتگی</h3>${(state.events||[]).length?`<div class="table-wrap"><table><thead><tr><th>عنوان</th><th>نوع</th><th>روز</th><th>زمان</th><th>ضبط‌شده</th><th>درس</th></tr></thead><tbody>${events}</tbody></table></div>`:emptyState('رویدادی ثبت نشده','کلاس حضوری، آنلاین، ضبط‌شده یا تعهد شخصی را اضافه کن.',actionBtn('افزودن رویداد','add-event'))}${conflicts.length?`<div class="advice warning"><span class="advice-mark">!</span><span>${conflicts.map(c=>`${DAYS[c.day]} · ${esc(c.a)} با ${esc(c.b)}`).join('؛ ')}</span></div>`:''}${unknownClassNote()}</article><article class="card tone-class"><h3 class="card-title">روال‌های ضروری روزانه</h3>${(state.routines||[]).length?`<div class="table-wrap"><table><thead><tr><th>عنوان</th><th>نوع</th><th>زمان</th><th>روزها</th></tr></thead><tbody>${routines}</tbody></table></div>`:emptyState('روالی ثبت نشده','خواب، غذا، استراحت یا رفت‌وآمد را اضافه کن.',actionBtn('افزودن روال','add-routine'))}</article><div class="advice"><span class="advice-mark">i</span><span>برنامه فقط فضای باقی‌مانده را پر می‌کند؛ اگر ظرفیت کم است، کار جا نمی‌شود و با دلیل در فهرست «جا نشده» می‌ماند.</span></div></div>`}

  // ---- صفحهٔ عقب‌افتادگی‌ها ----

  // ---- صفحهٔ تست و تحلیل ----
  function testsPage(){const tests=(state.attempts||[]).filter(a=>a.kind!=='official'&&a.kind!=='mock');const rows=[...tests].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr><td>${esc(a.name)}${a.draft?' <span class="pill warn">پیش‌نویس</span>':''}</td><td>${EXAM_KINDS[a.kind]||a.kind}</td><td>${esc(a.date)}${a.time?` · ${esc(a.time)}`:''}</td><td>${a.percentage===null||a.percentage===undefined?'پیش‌نویس':`${a.percentage.toFixed(1)}٪`}</td><td>${a.total===null||a.total===undefined?'نامشخص':`${a.correct} از ${a.total}`}</td><td>${fmtMin(num(a.duration))}</td><td>${a.error?`${a.error} · ${ERRORS[a.error]}`:'—'}</td><td>${a.draft?actionBtn('کامل کردن','edit-exam:'+a.id,'primary'):''}</td></tr>`).join('');const drafts=tests.filter(a=>a.draft);const last=tests.filter(a=>!a.draft).at(-1)||tests.at(-1);return `<div class="page-scroll">${pageHeader('تست و تحلیل','تست ابزار یادگیری است؛ خروجی‌اش اقدام اصلاحی است، نه فقط نمره',actionBtn('＋ ثبت تست','add-exam','primary'))}${examConflictNote()}${drafts.length?`<div class="advice"><span class="advice-mark">i</span><span>${drafts.length} تست در حالت پیش‌نویس است: دادهٔ ناقص ثبت شده تا فراموش نشود، ولی درصدی محاسبه نشده. برای محاسبه باید «کل» و همهٔ پاسخ‌ها کامل شوند.</span></div>`:''}${tests.length?`<div class="table-wrap"><table><thead><tr><th>نام</th><th>نوع</th><th>تاریخ</th><th>درصد</th><th>درست/کل</th><th>مدت</th><th>کد خطا</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${last?`<article class="card tone-exam"><h3 class="card-title">تحلیل آخرین تست</h3><p class="card-body">${esc(last.name)} · ${last.percentage===null||last.percentage===undefined?'پیش‌نویس':`${last.percentage.toFixed(1)}٪`} · ${last.error?`علت غالب: ${ERRORS[last.error]}`:'کد خطا ثبت نشده'}. تکرار یک علت یعنی روش قبلی کار نکرده است.</p>${actionBtn('ساخت اقدام اصلاحی','remediate','primary')}</article>`:''}`:emptyState('تستی ثبت نشده','تست تدریس، تست زمان‌دار یا آزمون مؤسسه را ثبت کن.',actionBtn('ثبت تست','add-exam','primary'))}<div class="advice"><span class="advice-mark">i</span><span>تست و آزمون جامع جدا هستند: تست برای یادگیری است، آزمون جامع برای سنجش سراسری.</span></div><div class="advice"><span class="advice-mark">i</span><span>هر تعداد تستی که در برنامهٔ روز می‌بینی <strong>پیشنهاد</strong> است نه سهمیه. هدف «پر کردن عدد» نیست؛ هدف این است که بدانی کجا هنوز نمی‌توانی. اگر تستی نزدی، دلیلش را ثبت کن تا تحلیل بعدی معنا داشته باشد.</span></div></div>`}

  // ---- صفحهٔ آزمون‌های جامع ----
  function comprehensivePage(){const exams=(state.attempts||[]).filter(a=>a.kind==='official'||a.kind==='mock').sort((a,b)=>a.date.localeCompare(b.date));let prev=null;const rows=exams.map(a=>{const pct=a.percentage===null||a.percentage===undefined?null:a.percentage;const delta=(prev===null||pct===null)?'—':`${pct-prev>0?'+':''}${(pct-prev).toFixed(1)}٪`;if(pct!==null)prev=pct;return `<tr><td>${esc(a.name)}${a.draft?' <span class="pill warn">پیش‌نویس</span>':''}</td><td>${EXAM_KINDS[a.kind]||a.kind}</td><td>${esc(a.date)}${a.time?` · ${esc(a.time)}`:''}</td><td>${pct===null?'پیش‌نویس':`${pct.toFixed(1)}٪`}</td><td>${a.total===null||a.total===undefined?'نامشخص':`${a.correct} از ${a.total}`}</td><td>${esc(a.attachmentName||'—')}</td><td>${delta}</td></tr>`}).join('');const withPct=exams.filter(a=>a.percentage!==null&&a.percentage!==undefined);const last=withPct.at(-1),before=withPct.at(-2);const drop=last&&before?last.percentage-before.percentage:null;return `<div class="page-scroll">${pageHeader('آزمون‌های جامع','سنجش سراسری نزدیک به شرایط واقعی',actionBtn('＋ ثبت آزمون جامع','add-exam','primary'))}${examConflictNote()}${examSeriesCard()}${exams.length?`<div class="table-wrap"><table><thead><tr><th>نام</th><th>نوع</th><th>تاریخ</th><th>درصد</th><th>درست/کل</th><th>پیوست</th><th>تغییر</th></tr></thead><tbody>${rows}</tbody></table></div>${drop!==null&&drop<-5?`<div class="advice warning"><span class="advice-mark">!</span><span>درصد آخرین آزمون جامع افت کرده است. علت را ثبت کن: حجم بیشتر بود؟ روش عوض نشده؟ خستگی؟ بدون علت، برنامهٔ بعدی همان اشتباه را تکرار می‌کند.</span></div>`:'<div class="advice"><span class="advice-mark">✓</span><span>روند درصد پایدار یا صعودی است.</span></div>'}`:emptyState('آزمون جامعی ثبت نشده','آزمون رسمی یا شبیه‌سازی چند درسی را ثبت کن.',actionBtn('ثبت آزمون جامع','add-exam','primary'))}<div class="advice"><span class="advice-mark">i</span><span>آزمون جامع فقط وقتی معنا دارد که بعد از آن برنامه عوض شود: گلوگاه پیدا شود، اولویت‌ها بازبینی شوند و مهلت‌ها بازمحاسبه شوند.</span></div></div>`}

  // ---- صفحهٔ بانک دروس ----
  function coursesPage(){const rows=(state.topics||[]).map(t=>{const st=stageOf(t);return `<tr><td>${esc(t.name)}</td><td>${esc(t.subjectName||'—')}</td><td>${esc(stageLabel('konkur',st.konkur))}</td><td>${stageProgress('konkur',st.konkur)}٪</td><td>${esc(stageLabel('final',st.final))}</td><td>${stageProgress('final',st.final)}٪</td><td>${fmtMin(num(t.estimatedMinutes))}</td>${factorCells(t)}</tr>`}).join('');return `<div class="page-scroll">${pageHeader('بانک دروس','هر مبحث دو مسیر مستقل دارد؛ پیشرفت هر مسیر نیازمند شاهد است',`${actionBtn('＋ افزودن مبحث','add-topic','primary')}${actionBtn('فاکتورهای اولویت','topic-fields')}`)}${(state.topics||[]).length?`<div class="table-wrap"><table><thead><tr><th>مبحث</th><th>درس</th><th>مسیر کنکور</th><th>پیشرفت</th><th>مسیر نهایی</th><th>پیشرفت</th><th>پیش‌نیاز</th><th>مقدار</th><th>منبع و اطمینان</th><th>سهم نهایی</th><th>مقدار</th><th>منبع و اطمینان</th></tr></thead><tbody>${rows}</tbody></table></div>${prioritySourcesCard()}<div class="advice"><span class="advice-mark">i</span><span>مسیر کنکور: ${KONKUR_STAGES.join(' ← ')}. مسیر نهایی: ${FINAL_STAGES.join(' ← ')}. هیچ‌کدام جای دیگری را نمی‌گیرد و مطالعهٔ تشریحی، تمرین تستی را جانشین نمی‌کند.</span></div>`:emptyState('موردی ثبت نشده','مبحث یا خروجی قابل سنجش اضافه کن.',actionBtn('افزودن مبحث','add-topic','primary'))}<article class="card tone-study"><h3 class="card-title">مباحث و تسلط</h3><p class="card-body">سنجش عملکردی، روش پیشنهادی و ثبت شاهد هر مبحث در نسخهٔ کامل این صفحه است. این پیش‌نمایش پله‌ها را از شواهد ثبت‌شده تخمین می‌زند.</p>${actionBtn('رفتن به مباحث و تسلط','go-topics')}</article>${resourceBankPage(resourceSubject)}</div>`}

  // ---- صفحهٔ برنامه هفتگی ----
  function weeklyPage(){const plan=makePlan();const week=weekDates();const today=todayISO();const rows=week.map((d,i)=>{const sess=sessionTotals(sessionsBetween(d,d));const dayBlocks=(state.events||[]).filter(e=>e.weekday===i);const busy=dayBlocks.reduce((n,b)=>n+(minOf(b.end)-minOf(b.start)),0);const capacity=Math.max(0,minOf(state.settings.sleep)-minOf(state.settings.wake));const free=Math.max(0,capacity-busy);return `<tr><td>${DAYS[i]}</td><td>${esc(d)}</td><td>${fmtMin(capacity)}</td><td>${fmtMin(free)}</td><td>${fmtMin(sess.total)}</td><td>${d===today?'امروز':''}</td></tr>`}).join('');const open=(state.activities||[]).filter(a=>!['done','dropped','expired'].includes(a.state));const incomplete=open.filter(a=>a.state==='partial'||a.state==='overdue');return `<div class="page-scroll">${pageHeader('برنامه هفتگی','نمای هفت روز، بازبینی شبانه و بازسازی بدون دست‌زدن به کلاس‌ها',`${actionBtn('بازبینی و بازسازی شبانه','nightly-review','primary')}${actionBtn('＋ افزودن کار','add-activity')}`)}<div class="metrics"><article class="metric tone-timer"><p class="metric-label">ظرفیت امروز</p><p class="metric-value">${fmtMin(plan.capacity)}</p><p class="metric-hint">بر اساس خواب/بیداری</p></article><article class="metric tone-study"><p class="metric-label">برنامه‌ریزی‌شده</p><p class="metric-value">${fmtMin(plan.placements.reduce((n,x)=>n+x.minutes,0))}</p></article><article class="metric tone-ok"><p class="metric-label">اجراشده</p><p class="metric-value">${fmtMin(sessionTotals(sessionsBetween(today,today)).total)}</p></article><article class="metric tone-backlog"><p class="metric-label">کار ناقص</p><p class="metric-value">${incomplete.length}</p><p class="metric-hint">نیازمند تصمیم، نه انتقال خودکار</p></article></div><article class="card tone-study"><h3 class="card-title">نمای هفت روز</h3><div class="table-wrap"><table><thead><tr><th>روز</th><th>تاریخ</th><th>ظرفیت</th><th>آزاد</th><th>اجراشده</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></article><article class="card tone-study"><h3 class="card-title">کارهای روز</h3>${plan.placements.length?`<div class="table-wrap"><table><thead><tr><th>زمان</th><th>مدت</th><th>کار</th><th>دلیل</th></tr></thead><tbody>${plan.placements.map(x=>`<tr><td>${clock(x.start)}–${clock(x.end)}</td><td>${fmtMin(x.minutes)}</td><td>${esc(x.title)}</td><td>${esc(x.reasons)}</td></tr>`).join('')}</tbody></table></div>`:emptyState('برنامه‌ای برای امروز نیست','فعالیت یا مرور واقعی اضافه کن.',actionBtn('افزودن فعالیت','add-activity'))}${plan.unplaced.length?`<h3 class="card-title">کارهایی که جا نشدند (پنهان نشده‌اند)</h3><div class="table-wrap"><table><tbody>${plan.unplaced.map(x=>`<tr><td>${esc(x.title)}</td><td>${fmtMin(x.minutes)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>`:''}</article><div class="advice"><span class="advice-mark">i</span><span>بازسازی شبانه کار نیمه‌تمام را کورکورانه به فردا نمی‌برد: اول اهمیت و فوریتش سنجیده می‌شود، بعد بین روزهای باز توزیع می‌شود.</span></div></div>`}
})();
</script>
</body></html>
