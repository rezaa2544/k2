/* ---------------------------------------------------------------------------
   هویت بصری پیش‌نمایش K2 — زنده، پرکنتراست، با رنگ معنایی برای هر نوع کار.
   فونت «استعداد» داخل خود فایل HTML embed شده (build_preview.py) و آفلاین
   می‌ماند؛ اینجا فقط font-family و وزن‌ها تعریف می‌شود.
   --------------------------------------------------------------------------- */

:root {
  /* زمینه و سطح */
  --bg:#e9eff1; --surface:#fff; --surface-soft:#f2f7f5; --surface-sunk:#e3ebe9;
  --text:#0b1a18; --text-soft:#2f4644; --muted:#556967;
  --border:#c9d9d4; --border-strong:#93b2ab;
  /* لهجهٔ اصلی */
  --accent:#0a7a57; --accent-hover:#06603f; --accent-soft:#d3f1e3;
  --accent-line:#63c8a5; --accent-deep:#053326;
  /* رنگ معناییِ نوع کار */
  --study:#0a7a57; --study-soft:#d3f1e3;
  --review:#4639b8; --review-soft:#e2e0fb;
  --exam:#bf5806; --exam-soft:#fce9d7;
  --deadline:#bf2b26; --deadline-soft:#fbe2e0;
  --timer:#0a6d8a; --timer-soft:#d6edf6;
  --backlog:#a93260; --backlog-soft:#fbe0ea;
  --class:#7442ae; --class-soft:#ece3fa;
  --problem:#9c5610; --problem-soft:#fcedd9;
  /* وضعیت */
  --info:#1259b8; --info-soft:#dbe9fb;
  --warn:#8f5406; --warn-soft:#faecd3;
  --danger:#ad231b; --danger-soft:#fbe1df;
  --ok:#127a39; --ok-soft:#d9f2e0;
  /* نوار کناری */
  --sidebar:#052e26; --sidebar-soft:#0a4536; --sidebar-line:#0f5645;
  --sidebar-text:#e4f2ed; --sidebar-muted:#8cb2a8;
  --shadow:0 24px 72px #0d2b241f;
}
*{box-sizing:border-box}
html{min-width:320px;background:#dfe6e9}
body{
  margin:0;padding:24px;color:var(--text);
  font-family:'Estedad',Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:14px;line-height:1.7;
  background:radial-gradient(ellipse at 50% -15%,#fff 0,#dfe6e9 66%);
}
button,input,select{font:inherit}
button{cursor:pointer}
.preview-wrap{max-width:1390px;margin:0 auto}

/* ---------- پنجرهٔ برنامه ---------- */
.app-window{
  overflow:hidden;border:2px solid var(--border);border-radius:18px;
  background:var(--bg);box-shadow:var(--shadow);
}
.menu-bar{
  position:relative;z-index:5;display:flex;align-items:center;
  justify-content:space-between;min-height:52px;padding:6px 13px;
  background:var(--surface);border-bottom:2px solid var(--border);
}
.menu-group{display:flex;align-items:center;gap:4px}
.menu-wrap{position:relative}
.menu-button{
  min-height:38px;padding:6px 16px;border:2px solid transparent;border-radius:9px;
  background:transparent;color:var(--text);font-weight:700;
  transition:background .15s,color .15s,border-color .15s;
}
.menu-button:hover,.menu-button[aria-expanded="true"]{
  background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);
}
.menu-button:focus-visible,.menu-item:focus-visible,.nav-item:focus-visible,.btn:focus-visible{
  outline:3px solid var(--accent-line);outline-offset:2px;
}
.menu-meta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;font-weight:500}
.menu-panel{
  position:absolute;top:calc(100% + 6px);right:0;display:none;width:290px;padding:8px;
  border:2px solid var(--border);border-radius:13px;background:var(--surface);
  box-shadow:0 18px 42px #0d2b2424;
}
.menu-panel.open{display:block;animation:menu-in .12s ease-out}
@keyframes menu-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.menu-item{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;border:0;border-radius:9px;background:transparent;
  text-align:right;color:var(--text);font-size:13px;font-weight:600;
}
.menu-item:hover{background:var(--accent-soft);color:var(--accent)}
.menu-item-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.menu-item-title{font-weight:700}
.menu-item-hint{color:var(--muted);font-size:10px;font-weight:500}
.shortcut{
  direction:ltr;white-space:nowrap;padding:3px 8px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface-soft);color:var(--muted);
  font-family:Consolas,monospace;font-size:10px;
}
.menu-separator{height:2px;margin:6px 9px;background:var(--border)}

/* ---------- چیدمان کلی ---------- */
.app-layout{display:flex;min-height:750px;max-height:calc(100vh - 48px);direction:rtl}
.sidebar{
  display:flex;flex:0 0 250px;flex-direction:column;padding:20px 14px 15px;
  background:var(--sidebar);color:var(--sidebar-text);
}
.brand{display:flex;align-items:center;gap:12px;padding:3px 3px 0}
.brand-mark{
  display:grid;width:44px;height:44px;place-items:center;border-radius:13px;
  background:var(--accent);color:white;font-size:19px;font-weight:900;letter-spacing:-1px;
}
.brand-name{color:white;font-size:15px;font-weight:800;line-height:1.5}
.brand-caption{color:var(--sidebar-muted);font-size:10px;font-weight:500}
.side-divider{height:2px;margin:20px 7px 14px;background:var(--sidebar-line)}
.side-caption{padding:0 11px 7px;color:var(--sidebar-muted);font-size:10px;font-weight:700;letter-spacing:1px}
.nav-list{display:flex;flex:1;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.nav-item{
  display:flex;min-height:46px;align-items:center;gap:12px;padding:8px 13px;
  border:0;border-right:4px solid transparent;border-radius:10px;
  background:transparent;color:var(--sidebar-text);text-align:right;
  font-size:13px;font-weight:600;transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--sidebar-soft);color:#fff}
.nav-item.active{border-right-color:var(--accent-line);background:var(--accent);color:#fff;font-weight:800}
.nav-icon{display:grid;width:21px;place-items:center;color:#a8c6bd;font-size:18px}
.nav-item.active .nav-icon{color:white}
.sidebar-footer{
  margin-top:18px;padding:13px 12px;border:1px solid var(--sidebar-line);
  border-radius:11px;background:var(--sidebar-soft);color:var(--sidebar-text);
  font-size:11px;font-weight:600;
}
.sidebar-footer strong{display:block;margin-bottom:4px;color:#a6dfc7;font-size:11px;font-weight:800}

/* ---------- نوار بالا ---------- */
.content-area{display:flex;min-width:0;flex:1;flex-direction:column;padding:17px 20px 13px;gap:14px}
.topbar{
  display:flex;min-height:72px;align-items:center;gap:13px;padding:11px 17px;
  border:2px solid var(--border);border-radius:15px;background:var(--surface);
}
.top-title-box{min-width:0;flex:1}
.top-title{margin:0;color:var(--text);font-size:18px;font-weight:800;line-height:1.5}
.top-subtitle{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:500}
.date-label{white-space:nowrap;color:var(--text-soft);font-size:12px;font-weight:600}

/* ---------- دکمه‌ها ---------- */
.btn{
  display:inline-flex;min-height:39px;align-items:center;justify-content:center;gap:8px;
  padding:8px 15px;border:2px solid var(--border);border-radius:10px;
  background:white;color:var(--text);font-size:13px;font-weight:700;
  transition:background .15s,border-color .15s,transform .15s;
}
.btn:hover{border-color:var(--border-strong);background:var(--surface-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:800}
.btn.primary:hover{border-color:var(--accent-hover);background:var(--accent-hover)}
.btn.soft{background:#ffffffb8}
.btn.danger{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}

/* ---------- صفحه ---------- */
/* .page-content تنها ناحیهٔ اسکرول‌شدنیِ پنجره است. بی overflow، صفحه‌های بلند
   (مثل راه‌اندازی با فهرست کامل کتاب‌ها) کل پنجرهٔ شبیه‌سازی‌شده را کش می‌دادند
   و در صفحهٔ مرورگر به بلندی هزاران پیکسل می‌رسید. */
.page-content{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.page-scroll{display:flex;flex-direction:column;gap:14px;padding:1px 2px 7px}
.page-heading{margin:0;color:var(--text);font-size:17px;font-weight:900}
.page-intro{margin:-9px 0 0;color:var(--muted);font-size:12px;font-weight:500}
/* ---------- راه‌اندازی: ستون جمع‌وجود، حدود نیمی از عرض محتوا ---------- */
.setup-shell{width:100%;max-width:min(560px,100%);margin-inline:auto;display:flex;flex-direction:column;gap:9px}
.setup-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.setup-card{padding:11px 12px;border-radius:13px}
.setup-card .card-title{margin-bottom:8px}
/* ردیف کنش‌های راه‌اندازی: کنش‌های فرعی کنار هم و کنش اصلی لبهٔ مقابل.
   قبلاً دو <span> خالی با space-between فاصلهٔ مردهٔ بزرگ می‌ساختند و دکمهٔ
   اصلی را به لبهٔ مقابل پرت می‌کردند. */
.setup-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
.setup-actions .btn.primary{margin-inline-start:auto}
.setup-course-list{display:grid;gap:7px;margin:8px 0}
.setup-course-list .card{padding:9px 10px;border-radius:11px}
.setup-course-list .catalog-course{margin:0}
.setup-course-list .book-list{margin-top:6px;gap:4px}
.setup-course-list .book-row{padding:5px 7px}
.setup-inline{flex-direction:row;align-items:center;gap:6px;font-size:12px;font-weight:700}
.setup-card .list-row{padding:5px 0;font-size:12px}
.setup-card .advice{margin-top:8px;font-size:11px;line-height:1.9}
.setup-card .card-body{line-height:1.9}
.setup-card .form-grid{margin:8px 0;gap:9px}

/* ---------- کارت قهرمان ---------- */
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:22px;padding:19px 21px;
  border:2px solid var(--accent-line);border-right:7px solid var(--accent);
  border-radius:19px;background:var(--accent-soft);
}
.hero-copy{min-width:0;flex:1}
.eyebrow{margin:0 0 4px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1px}
.hero-title{margin:0;color:var(--text);font-size:19px;font-weight:900;line-height:1.55}
.hero-body{margin:5px 0 0;color:var(--text-soft);font-size:13px;font-weight:500}
.hero-actions{display:flex;flex:0 0 auto;flex-direction:column;gap:8px}

/* ---------- کاشی‌های آماری ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.metric{
  min-height:110px;padding:15px 16px;border:2px solid var(--border);
  border-right:5px solid var(--accent);border-radius:14px;background:var(--surface);
}
.metric-label{margin:0;color:var(--muted);font-size:11px;font-weight:700}
.metric-value{margin:5px 0 2px;color:var(--accent);font-size:22px;font-weight:900;line-height:1.45}
.metric-hint{margin:0;color:var(--muted);font-size:10px;font-weight:500}
/* رنگ معنایی کاشی‌ها — با کلاس یا به‌صورت پیش‌فرض با ترتیب */
.metric.tone-study,.metric:nth-child(1) .metric-value{color:var(--study)}
.metric.tone-review,.metric:nth-child(5) .metric-value{color:var(--review)}
.metric.tone-exam,.metric:nth-child(2) .metric-value{color:var(--exam)}
.metric.tone-deadline,.metric:nth-child(4) .metric-value{color:var(--deadline)}
.metric.tone-timer,.metric:nth-child(1) .metric-value{color:var(--timer)}
.metric.tone-backlog,.metric:nth-child(4) .metric-value{color:var(--backlog)}
.metric.tone-ok,.metric:nth-child(3) .metric-value{color:var(--ok)}
.metric.tone-info,.metric:nth-child(2) .metric-value{color:var(--info)}
.metric.tone-study{border-right-color:var(--study);background:var(--study-soft)}
.metric.tone-review{border-right-color:var(--review);background:var(--review-soft)}
.metric.tone-exam{border-right-color:var(--exam);background:var(--exam-soft)}
.metric.tone-deadline{border-right-color:var(--deadline);background:var(--deadline-soft)}
.metric.tone-timer{border-right-color:var(--timer);background:var(--timer-soft)}
.metric.tone-backlog{border-right-color:var(--backlog);background:var(--backlog-soft)}
.metric.tone-class{border-right-color:var(--class);background:var(--class-soft)}
.metric.tone-problem{border-right-color:var(--problem);background:var(--problem-soft)}
.metric.tone-ok{border-right-color:var(--ok);background:var(--ok-soft)}
.metric.tone-info{border-right-color:var(--info);background:var(--info-soft)}

/* ---------- کارت‌ها ---------- */
.detail-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:11px}
.card{
  min-width:0;padding:16px 17px;border:2px solid var(--border);
  border-radius:15px;background:var(--surface);
}
.card-title{margin:0 0 11px;color:var(--text);font-size:13px;font-weight:800}
.card-body{margin:0;color:var(--text-soft);font-size:12px;line-height:2;font-weight:500}
.card-body .row{display:flex;justify-content:space-between;gap:9px;border-bottom:1px dashed var(--border)}
.card-body .row:last-child{border:0}
.value-strong{color:var(--text);font-weight:800}
/* تُن معنایی کارت: زمینهٔ tint + نوار راست ضخیم */
.card.tone-study{border-color:var(--study);border-right:6px solid var(--study);background:var(--study-soft)}
.card.tone-review{border-color:var(--review);border-right:6px solid var(--review);background:var(--review-soft)}
.card.tone-exam{border-color:var(--exam);border-right:6px solid var(--exam);background:var(--exam-soft)}
.card.tone-deadline{border-color:var(--deadline);border-right:6px solid var(--deadline);background:var(--deadline-soft)}
.card.tone-timer{border-color:var(--timer);border-right:6px solid var(--timer);background:var(--timer-soft)}
.card.tone-backlog{border-color:var(--backlog);border-right:6px solid var(--backlog);background:var(--backlog-soft)}
.card.tone-class{border-color:var(--class);border-right:6px solid var(--class);background:var(--class-soft)}
.card.tone-problem{border-color:var(--problem);border-right:6px solid var(--problem);background:var(--problem-soft)}
.card.tone-accent{border-color:var(--accent);border-right:6px solid var(--accent);background:var(--accent-soft)}
.card.tone-info{border-color:var(--info);border-right:6px solid var(--info);background:var(--info-soft)}
.card.tone-warn{border-color:var(--warn);border-right:6px solid var(--warn);background:var(--warn-soft)}
.card.tone-danger{border-color:var(--danger);border-right:6px solid var(--danger);background:var(--danger-soft)}
.card.tone-ok{border-color:var(--ok);border-right:6px solid var(--ok);background:var(--ok-soft)}

/* ---------- نکتهٔ مشاور و حالت خالی ---------- */
.advice{
  display:flex;align-items:flex-start;gap:10px;padding:13px 15px;
  border:2px solid var(--accent-line);border-right:5px solid var(--accent);
  border-radius:12px;background:var(--accent-soft);color:var(--text-soft);
  font-size:12px;font-weight:600;
}
.empty-state{
  display:flex;min-height:220px;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;padding:24px;text-align:center;
  border:2px dashed var(--border-strong);border-radius:15px;
  background:var(--surface-soft);color:var(--muted);
}
.empty-state h3{margin:0;color:var(--text);font-size:16px;font-weight:800}
.empty-state p{max-width:520px;margin:0 0 6px;line-height:2}
.empty-mark{
  display:grid;width:40px;height:40px;place-items:center;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-size:24px;font-weight:700;
}
.advice-mark{
  display:grid;width:24px;height:24px;flex:none;place-items:center;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:900;
}

/* ---------- نوار وضعیت ---------- */
.status-bar{
  display:flex;min-height:34px;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 13px;border-top:2px solid var(--border);background:#fff;
  color:var(--muted);font-size:11px;font-weight:500;
}
.privacy{display:flex;align-items:center;gap:7px;color:var(--text-soft);font-weight:600}
.privacy-dot{color:var(--ok);font-size:13px}
.preview-stamp{direction:ltr;white-space:nowrap;color:var(--muted);font-family:Consolas,monospace;font-size:9px}

/* ---------- اجزای قابل استفادهٔ مشترک ---------- */
.section-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.table-wrap{overflow:auto;border:2px solid var(--border);border-radius:13px;background:white}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
th{
  padding:11px 13px;background:var(--surface-sunk);color:var(--text-soft);
  text-align:right;font-weight:800;border-bottom:2px solid var(--border);
}
td{padding:11px 13px;border-bottom:1px solid var(--border);color:var(--text-soft);font-weight:500}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-soft)}
.pill{
  display:inline-flex;align-items:center;padding:4px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;
}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gray{background:var(--surface-sunk);color:var(--muted)}
.pill.study{background:var(--study-soft);color:var(--study)}
.pill.review{background:var(--review-soft);color:var(--review)}
.pill.exam{background:var(--exam-soft);color:var(--exam)}
.pill.deadline{background:var(--deadline-soft);color:var(--deadline)}
.pill.timer{background:var(--timer-soft);color:var(--timer)}
.pill.backlog{background:var(--backlog-soft);color:var(--backlog)}
.pill.class{background:var(--class-soft);color:var(--class)}
.pill.problem{background:var(--problem-soft);color:var(--problem)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.small-stat{
  padding:13px;border:2px solid var(--border);border-right:5px solid var(--accent);
  border-radius:12px;background:var(--surface);
}
.small-stat span{display:block;color:var(--muted);font-size:10px;font-weight:600}
.small-stat strong{display:block;margin-top:4px;color:var(--text);font-size:17px;font-weight:900}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:12px;font-weight:500;
}
.list-row:last-child{border:0}
.progress{height:9px;overflow:hidden;border-radius:99px;background:var(--surface-sunk)}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.chart{
  display:flex;height:140px;align-items:flex-end;justify-content:space-around;gap:13px;
  padding:13px 13px 0;border-bottom:2px solid var(--border);
}
.chart-col{
  display:flex;width:11%;height:100%;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:7px;color:var(--muted);font-size:10px;font-weight:600;
}
.chart-bar{
  width:100%;max-width:38px;min-height:5px;border-radius:8px 8px 0 0;
  background:linear-gradient(var(--accent-line),var(--accent));
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  padding:13px 0;border-bottom:1px solid var(--border);
}
.setting-row:last-child{border:0}
.setting-row span{color:var(--text-soft);font-size:12px;font-weight:600}
.setting-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}

/* ---------- اعلان و پنجرهٔ محاوره ---------- */
.toast{
  position:fixed;right:24px;bottom:22px;z-index:30;
  max-width:min(420px,calc(100vw - 32px));padding:12px 16px;
  border:2px solid var(--accent-line);border-radius:12px;background:#fff;
  color:var(--text-soft);box-shadow:0 12px 32px #0d2b2430;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateY(0)}
.modal-backdrop{
  position:fixed;inset:0;z-index:40;display:none;align-items:center;
  justify-content:center;padding:20px;background:#052e2699;backdrop-filter:blur(3px);
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;
  border:2px solid var(--border);border-radius:18px;background:white;
  box-shadow:0 24px 70px #052e2640;
}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.modal h2{margin:0;font-size:18px;font-weight:900}
.modal-close{
  width:35px;height:35px;border:0;border-radius:9px;background:var(--surface-sunk);
  color:var(--text-soft);font-size:19px;font-weight:700;
}
.modal p{color:var(--muted);font-size:13px;line-height:1.9}
.modal-progress{height:8px;margin:16px 0;border-radius:99px;background:var(--surface-sunk)}
.modal-progress i{display:block;width:8.33%;height:100%;border-radius:inherit;background:var(--accent)}
.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:16px}

/* ---------- واکنش‌گرایی ---------- */
@media(max-width:1000px){
  body{padding:12px}.sidebar{flex-basis:224px}.content-area{padding:14px}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-grid .card:first-child{grid-column:span 2}
}
@media(max-width:720px){
  .app-layout{min-height:720px;flex-direction:column}
  .sidebar{flex:0 0 auto;padding:10px 10px 8px}
  .brand{display:none}
  .side-divider,.side-caption,.sidebar-footer{display:none}
  .nav-list{flex-direction:row;overflow:auto;gap:5px}
  .nav-item{min-width:max-content;min-height:41px;padding:6px 11px;font-size:12px}
  .content-area{padding:11px;gap:11px}
  .topbar{min-height:63px;padding:9px 12px}
  .date-label{display:none}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{align-items:flex-start;flex-direction:column;gap:14px}
  .hero-actions{width:100%;flex-direction:row}
  .hero-actions .btn{flex:1}
  .detail-grid{grid-template-columns:1fr}
  .detail-grid .card:first-child{grid-column:auto}
  .mini-grid{grid-template-columns:1fr}
  .menu-meta .note-hide{display:none}
}
@media(max-width:450px){
  body{padding:7px}
  .app-window{border-radius:13px}.menu-bar{min-height:46px;padding:4px 8px}
  .menu-button{padding:5px 11px}.menu-meta{font-size:10px}
  .menu-panel{width:min(290px,calc(100vw - 24px))}
  .content-area{padding:9px}.top-title{font-size:16px}
  .btn{padding:7px 10px;font-size:12px}.metric{padding:12px}.metric-value{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- سرفصل، ارزیابی گفتار و بانک منابع ---------- */
.syllabus-chapter{margin:12px 0}
.syllabus-sec-row td{vertical-align:middle}
.assess-steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.assess-step{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);background:#fff}
.assess-step.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.assess-step.current{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.resource-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:11px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

const sylKey = (subject, grade, chapter) => `${subject}|${grade}|${chapter}`;
const secKey = (subject, grade, chapter, section) => `${subject}|${grade}|${chapter}|${section}`;

/** فصل‌های یک درس/پایه با ادغام ویرایش‌های کاربر. */
function syllabusChapters(subject, grade) {
  const base = (window.K2_SYLLABUS?.[subject]?.[String(grade)]) || [];
  const edits = state.syllabusEdits || {};
  return base.map((ch) => {
    const e = edits[sylKey(subject, grade, ch.no)] || {};
    return {
      no: ch.no,
      title: e.title ?? ch.title,
      // ادیت تأییدشده از کتاب مقدم است؛ «خالی» یعنی کاربر عمداً نامشخص
      // کرده است، نه اینکه عدد کتاب برگردد.
      sections: e.confirmed === true ? e.sections : (e.sections ?? ch.sections),
      confirmed: e.confirmed === true,
    };
  });
}

/** تعداد گفتارهای شناخته‌شدهٔ یک فصل؛ ``null`` یعنی نامشخص. */
function chapterSectionCount(ch) {
  return ch.sections === null || ch.sections === undefined ? null : Number(ch.sections);
}

/**
 * فهرست گفتارهای نام‌دار یک فصل از دادهٔ اولیه؛ ``null`` یعنی این فصل
 * گفتارنامهٔ رسمی ندارد و فقط شماره دارد.
 */
function chapterTopics(subject, grade, ch) {
  const base = ((window.K2_SYLLABUS || {})[subject] || {})[String(grade)] || [];
  const found = base.find((c) => c.no === ch.no);
  if (!found || !Array.isArray(found.topics)) return null;
  return found.topics.map((t) => ({
    no: Number(String(t.id).split('|')[3]),
    id: t.id,
    title: t.title,
    verified: t.verified === true,
  }));
}

/** شناسهٔ پایدار گفتار — همان کلیدی که وضعیت مطالعه با آن ذخیره می‌شود. */
function topicIdOf(subject, grade, chapter, section) {
  return `${subject}|${grade}|${chapter}|${section}`;
}

/**
 * عنوان قابل نمایش یک گفتار.
 *
 * ترتیب: ویرایش کاربر ← نام دادهٔ اولیه ← «گفتار N».
 * اگر نام اولیه ثبت نشده باشد، صریحاً «نام ثبت نشده» می‌گوید؛ نامی ساخته
 * نمی‌شود.
 */
function topicLabel(subject, grade, ch, sec) {
  const topics = chapterTopics(subject, grade, ch);
  const t = topics && topics.find((x) => x.no === Number(sec));
  const edited = (state.topicTitles || {})[topicIdOf(subject, grade, ch.no, sec)];
  if (edited) return edited;
  if (t && t.title) return t.title;
  return `گفتار ${sec} · نام ثبت نشده`;
}

/** رکورد ارزیابی یک گفتار (بدون ساخت خودکار). */
function sectionRecord(subject, grade, chapter, section) {
  return (state.sections || {})[secKey(subject, grade, chapter, section)] || null;
}

/** آیا این گفتار نیازمند جبران است؟ فهرست نوع عقب‌افتادگی‌ها را برمی‌گرداند. */
function sectionNeeds(rec) {
  if (!rec) return [];
  const out = [];
  for (const [qkey, values, backlogType, label] of ASSESS_TO_BACKLOG) {
    if (values.includes(rec[qkey])) out.push({ type: backlogType, label, question: qkey });
  }
  return out;
}

/** تسلط خوداظهاری یا ``null`` اگر کاربر مطمئن نیست. */
function sectionMastery(rec) {
  if (!rec || rec.mastery === null || rec.mastery === undefined || rec.mastery === '') return null;
  const n = Number(rec.mastery);
  return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : null;
}

/** برچسب کوتاه وضعیت گفتار برای نمایش در جدول. */
function sectionBadge(rec) {
  if (!rec || !rec.updatedAt) return { text: 'ارزیابی نشده', tone: 'warn' };
  const needs = sectionNeeds(rec);
  if (!needs.length) return { text: 'نیازی باز نیست', tone: 'ok' };
  if (needs.length >= 3) return { text: `${needs.length} نیاز باز`, tone: 'danger' };
  return { text: `${needs.length} نیاز باز`, tone: 'backlog' };
}

/** درصد تکمیل ارزیابی (برای نمایش پیشرفت). */
function sectionAnswered(rec) {
  if (!rec) return 0;
  let n = 0;
  for (const q of ASSESS_QUESTIONS) if (rec[q.key]) n += 1;
  return n;
}

/* ---------- ۴. فرم ارزیابی مرحله‌ای (هشت سؤال) ---------- */

let assessDraft = null;

function assessStart(subject, grade, chapter, section) {
  const existing = sectionRecord(subject, grade, chapter, section) || {};
  assessDraft = {
    subject, grade, chapter, section, step: 0,
    // پاسخ‌های قبلی از خودِ فهرست سؤال‌ها خوانده می‌شوند تا «ویرایش پاسخ»
    // برای هر سؤالی کار کند — با فهرست دستی، سؤال تازه بی‌جواب باز می‌شد.
    answers: Object.fromEntries(
      ASSESS_QUESTIONS.map(q => [q.key, existing[q.key] ?? null])),
    mastery: existing.mastery ?? null,
    masteryUnknown: existing.mastery === null || existing.mastery === undefined || existing.mastery === '',
    pagesTotal: existing.pagesTotal ?? null,
    pagesDone: existing.pagesDone ?? null,
    testsTotal: existing.testsTotal ?? null,
    testsCorrect: existing.testsCorrect ?? null,
    testsWrong: existing.testsWrong ?? null,
    testsBlank: existing.testsBlank ?? null,
    minutesSpent: existing.minutesSpent ?? null,
    notes: existing.notes ?? '',
  };
  assessRender();
}

function assessRender() {
  if (!assessDraft) return;
  const d = assessDraft;
  const title = `گفتار ${d.section} · فصل ${d.chapter} · ${d.subject}`;
  if (d.step < ASSESS_QUESTIONS.length) {
    const q = ASSESS_QUESTIONS[d.step];
    const picked = d.answers[q.key];
    // عنوان خود سؤال («سؤال ۳ از ۸ · فهم مطلب») هم نمایش داده می‌شود؛
    // پیش‌تر فقط راهنما دیده می‌شد و کاربر نمی‌دانست کدام سؤال چندم است.
    let body = `<h3 class="card-title">${esc(q.title)}</h3><p class="card-body">${esc(q.hint)}</p><div class="button-row" style="flex-direction:column;align-items:stretch">`;
    for (const [val, label] of q.options) {
      body += `<button type="button" class="btn ${picked === val ? 'primary' : ''}" data-action="assess-pick:${q.key}:${val}">${esc(label)}</button>`;
    }
    body += `</div>`;
    if (q.askPages?.includes(picked)) {
      body += `<div class="form-grid"><label>تعداد صفحه/بخش خوانده‌شده<input name="pagesDone" type="number" min="0" inputmode="numeric" value="${d.pagesDone ?? ''}"></label><label>تعداد کل صفحه/بخش<input name="pagesTotal" type="number" min="0" inputmode="numeric" value="${d.pagesTotal ?? ''}"></label></div>`;
    }
    if (q.askTests?.includes(picked)) {
      body += `<div class="form-grid"><label>تست درست<input name="testsCorrect" type="number" min="0" inputmode="numeric" value="${d.testsCorrect ?? ''}"></label><label>تست غلط<input name="testsWrong" type="number" min="0" inputmode="numeric" value="${d.testsWrong ?? ''}"></label><label>تست نزده<input name="testsBlank" type="number" min="0" inputmode="numeric" value="${d.testsBlank ?? ''}"></label><label>زمان صرف‌شده (دقیقه)<input name="minutesSpent" type="number" min="0" inputmode="numeric" value="${d.minutesSpent ?? ''}"></label></div>`;
    }
    body += `<div class="modal-progress"><i style="width:${Math.round((d.step + 1) / (ASSESS_QUESTIONS.length + 1) * 100)}%"></i></div>`;
    body += `<div class="modal-actions">${d.step ? actionBtn('قبلی', 'assess-back') : ''}${actionBtn('بعدی', 'assess-next', 'primary')}${actionBtn('ذخیره و بستن', 'assess-save')}</div>`;
    dialog(title, body);
    return;
  }
  // گام آخر: میزان تسلط
  let body = `<h3 class="card-title">گام پایانی · میزان تسلط</h3><p class="card-body">میزان تسلط خودت را از ۰ تا ۱۰۰ مشخص کن. اگر مطمئن نیستی، گزینهٔ «مطمئن نیستم» را انتخاب کن؛ عدد ساختگی ثبت نمی‌شود.</p>`;
  body += `<div class="form-grid"><label>میزان تسلط (۰ تا ۱۰۰)<input name="mastery" type="number" min="0" max="100" inputmode="numeric" value="${d.masteryUnknown ? '' : (d.mastery ?? '')}" ${d.masteryUnknown ? 'disabled' : ''}></label></div>`;
  body += `<label class="check-label"><input type="checkbox" name="masteryUnknown" ${d.masteryUnknown ? 'checked' : ''} data-action="assess-mastery-unknown"> مطمئن نیستم / نیاز به ارزیابی</label>`;
  body += `<label>یادداشت (اختیاری)<textarea name="notes">${esc(d.notes || '')}</textarea></label>`;
  body += `<div class="modal-actions">${actionBtn('قبلی', 'assess-back')}${actionBtn('ذخیره ارزیابی', 'assess-save', 'primary')}${actionBtn('ذخیره و ساخت کارهای جبران', 'assess-backlog')}</div>`;
  dialog(title, body);
}

function assessCollect() {
  if (!assessDraft) return;
  const form = $('#modalForm');
  const d = assessDraft;
  if (form) {
    const data = new FormData(form);
    const g = (n) => { const v = data.get(n); return v === null || v === '' ? null : v; };
    d.pagesDone = g('pagesDone'); d.pagesTotal = g('pagesTotal');
    d.testsCorrect = g('testsCorrect'); d.testsWrong = g('testsWrong');
    d.testsBlank = g('testsBlank'); d.minutesSpent = g('minutesSpent');
    if (d.step >= ASSESS_QUESTIONS.length) {
      const mk = data.get('mastery');
      d.masteryUnknown = data.has('masteryUnknown') || mk === null || mk === '';
      d.mastery = d.masteryUnknown ? null : Math.max(0, Math.min(100, num(mk)));
      d.notes = String(data.get('notes') || '');
    }
  }
}

function assessSave(closeAfter = true) {
  assessCollect();
  const d = assessDraft;
  if (!d) return;
  const key = secKey(d.subject, d.grade, d.chapter, d.section);
  state.sections = state.sections || {};
  const prev = state.sections[key] || {};
  // پاسخ‌ها از خودِ فهرست سؤال‌ها ساخته می‌شوند، نه از فهرست دستی کلیدها.
  // چرا: پیش‌تر هر سؤال تازه در سه جا باید ثبت می‌شد و اگر جا می‌ماند،
  // بی‌صدا ذخیره نمی‌شد — کاربر پاسخ می‌داد و هیچ اتفاقی نمی‌افتاد.
  const answers = Object.fromEntries(
    ASSESS_QUESTIONS.map(q => [q.key, d.answers[q.key] ?? null]));
  state.sections[key] = {
    ...prev,
    ...answers,
    mastery: d.masteryUnknown ? null : d.mastery,
    pagesTotal: d.pagesTotal === null || d.pagesTotal === undefined ? null : num(d.pagesTotal),
    pagesDone: d.pagesDone === null || d.pagesDone === undefined ? null : num(d.pagesDone),
    testsTotal: d.testsTotal === null || d.testsTotal === undefined ? null : num(d.testsTotal),
    testsCorrect: d.testsCorrect === null || d.testsCorrect === undefined ? null : num(d.testsCorrect),
    testsWrong: d.testsWrong === null || d.testsWrong === undefined ? null : num(d.testsWrong),
    testsBlank: d.testsBlank === null || d.testsBlank === undefined ? null : num(d.testsBlank),
    minutesSpent: d.minutesSpent === null || d.minutesSpent === undefined ? null : num(d.minutesSpent),
    notes: d.notes || '',
    updatedAt: new Date().toISOString(),
  };
  if (closeAfter) {
    assessDraft = null;
    closeDialog();
    persist('ارزیابی گفتار ذخیره شد');
    render();
  }
}

/** از وضعیت ثبت‌شدهٔ گفتار، فعالیت‌های جبران می‌سازد (پیشنهادی، نه انجام‌شده). */
function assessCreateBacklog() {
  assessSave(false);
  const d = assessDraft;
  if (!d) return;
  const needs = sectionNeeds(state.sections[secKey(d.subject, d.grade, d.chapter, d.section)]);
  if (!needs.length) { notify('برای این گفتار نیاز بازهایی ثبت نشده است'); return; }
  const subject = (state.subjects || []).find((s) => s.name === d.subject);
  let created = 0;
  for (const need of needs) {
    state.activities = state.activities || [];
    state.activities.unshift({
      id: id(),
      title: `${need.label} · ${topicLabel(d.subject, d.grade, { no: d.chapter, title: '' }, d.section)} · فصل ${d.chapter} ${d.subject}`,
      type: need.type,
      subjectId: subject?.id || '',
      subjectName: d.subject,
      examCoefficient: subject?.examCoefficient ?? null,
      estimate: 30,
      actual: 0,
      remaining: 30,
      minChunk: 15,
      maxChunk: 45,
      splittable: true,
      deadline: '',
      deadlineDate: '',
      state: 'open',
      reason: `section:${secKey(d.subject, d.grade, d.chapter, d.section)}`,
      createdAt: new Date().toISOString(),
    });
    created += 1;
  }
  assessDraft = null;
  closeDialog();
  persist(`${created} کار جبران به‌صورت «برنامه‌ریزی‌شده» ثبت شد`);
  render();
}

/* ---------- ۵. بانک منابع مستقل ---------- */

const RESOURCE_TYPES = [
  ['textbook', 'کتاب درسی'],
  ['notes', 'جزوهٔ دبیر'],
  ['video', 'فیلم آموزشی'],
  ['homework', 'تکلیف کلاسی'],
  ['topic_test', 'تست مبحثی'],
  ['small_exam', 'آزمون کوچک'],
  ['comprehensive_exam', 'آزمون جامع'],
  ['answer_key', 'پاسخ‌نامه'],
  ['exam_analysis', 'تحلیل آزمون'],
  ['review_summary', 'مرور و خلاصه‌نویسی'],
  ['essay_question', 'سؤال تشریحی امتحان نهایی'],
  ['custom', 'منبع دلخواه'],
];

const RESOURCE_TYPE_LABEL = Object.fromEntries(RESOURCE_TYPES);

function resourceStatusLabel(s) {
  return ({ not_started: 'شروع نشده', in_progress: 'در جریان', done: 'انجام‌شده', unknown: 'نامشخص' })[s] || s || 'نامشخص';
}

/** فهرست منابع با امکان فیلتر بر اساس درس/فصل/گفتار. */
function resourcesFor(subject, chapter, section) {
  return (state.resources || []).filter((r) => {
    if (subject && r.subject !== subject) return false;
    if (chapter !== undefined && chapter !== null && String(r.chapter) !== String(chapter)) return false;
    if (section !== undefined && section !== null && String(r.section) !== String(section)) return false;
    return true;
  });
}

function resourceForm(resourceId, prefill = null) {
  const r = resourceId ? (state.resources || []).find((x) => x.id === resourceId) : null;
  const subjects = selectedSubjects();
  const subject = r?.subject || prefill?.subject || subjects[0]?.name || '';
  const grade = r?.grade ?? prefill?.grade ?? gradeOfSubject(subject);
  const chapterDefault = r?.chapter ?? prefill?.chapter ?? null;
  const sectionDefault = r?.section ?? prefill?.section ?? null;
  const chapters = subject ? syllabusChapters(subject, grade) : [];
  resourceEditId = r ? r.id : null;
  let body = `<form id="modalForm" data-modal-type="resource">`;
  body += `<div class="form-grid">`;
  body += `<label>نوع منبع<select name="type">${RESOURCE_TYPES.map(([v, l]) => `<option value="${v}" ${r?.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  body += `<label>عنوان منبع<input name="title" required value="${esc(r?.title || '')}" placeholder="مثلاً جزوهٔ فصل ۳ دبیرستان"></label>`;
  body += `<label>درس<select name="subject">${subjects.map((s) => `<option value="${esc(s.name)}" ${s.name === subject ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`;
  body += `<label>پایه<select name="grade">${[10, 11, 12].map((g) => `<option value="${g}" ${Number(grade) === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label>`;
  body += `<label>فصل<select name="chapter"><option value="">— بدون فصل —</option>${chapters.map((c) => `<option value="${c.no}" ${String(chapterDefault) === String(c.no) ? 'selected' : ''}>فصل ${c.no} · ${esc(c.title)}</option>`).join('')}</select></label>`;
  body += `<label>گفتار<input name="section" type="number" min="0" inputmode="numeric" value="${sectionDefault ?? ''}" placeholder="نامشخص = خالی"></label>`;
  body += `</div>`;
  body += `<div class="form-grid">`;
  body += `<label>تعداد کل<input name="total" type="number" min="0" inputmode="numeric" value="${r?.total ?? ''}" placeholder="نامشخص = خالی"></label>`;
  body += `<label>تعداد انجام‌شده<input name="done" type="number" min="0" inputmode="numeric" value="${r?.done ?? ''}"></label>`;
  body += `<label>مدت تخمینی هر مورد (دقیقه)<input name="estimateMin" type="number" min="0" inputmode="numeric" value="${r?.estimateMin ?? ''}"></label>`;
  body += `<label>وضعیت<select name="status">${[['not_started', 'شروع نشده'], ['in_progress', 'در جریان'], ['done', 'انجام‌شده'], ['unknown', 'نامشخص']].map(([v, l]) => `<option value="${v}" ${r?.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  body += `<label>موعد احتمالی<input name="deadline" type="date" value="${esc(r?.deadline || '')}"></label>`;
  body += `</div>`;
  body += `<label>توضیحات<input name="notes" value="${esc(r?.notes || '')}"></label>`;
  body += `<p class="card-body">تعداد باقی‌مانده خودکار از «کل منهای انجام‌شده» حساب می‌شود. اگر کل را خالی بگذاری، بدهی قطعی ثبت نمی‌شود و منبع «نامشخص» می‌ماند.</p>`;
  body += `<div class="modal-actions">${actionBtn('انصراف', 'close-dialog')}${actionBtn('ذخیره منبع', 'save-resource', 'primary')}</div>`;
  body += `</form>`;
  dialog(r ? 'ویرایش منبع' : 'افزودن منبع', body);
}

/** پایهٔ پیش‌فرض یک درس از روی کتاب‌های انتخاب‌شدهٔ کاربر. */
function gradeOfSubject(subjectName) {
  const b = (state.books || []).find((x) => x.subject === subjectName && x.selected !== false && x.grade);
  return b?.grade ?? 12;
}

function resourceRemaining(r) {
  if (r.total === null || r.total === undefined || r.total === '') return null;
  const total = num(r.total);
  const done = num(r.done);
  return Math.max(0, total - done);
}

function submitResource(form) {
  const d = new FormData(form);
  const v = (n) => { const x = d.get(n); return x === null || x === '' ? null : x; };
  const title = String(v('title') || '').trim();
  if (!title) { notify('عنوان منبع لازم است'); return; }
  const total = v('total') === null ? null : num(v('total'));
  const done = v('done') === null ? null : num(v('done'));
  if (total !== null && done !== null && done > total) { notify('تعداد انجام‌شده از کل بیشتر است'); return; }
  const obj = {
    id: resourceEditId || id(),
    type: v('type'),
    title,
    subject: v('subject') || '',
    grade: num(v('grade'), 12),
    chapter: v('chapter') === null ? null : num(v('chapter')),
    section: v('section') === null ? null : num(v('section')),
    total,
    done,
    remaining: total === null ? null : Math.max(0, num(total) - num(done)),
    estimateMin: v('estimateMin') === null ? null : num(v('estimateMin')),
    status: v('status') || 'unknown',
    deadline: v('deadline') || '',
    notes: v('notes') || '',
    updatedAt: new Date().toISOString(),
  };
  state.resources = state.resources || [];
  const i = state.resources.findIndex((x) => x.id === obj.id);
  if (i >= 0) state.resources[i] = obj; else state.resources.unshift(obj);
  closeDialog();
  persist('منبع ذخیره شد');
  render();
}

/* ---------- ۶. نمای درخت سرفصل ---------- */

function syllabusSectionRow(subject, grade, ch, sec) {
  const rec = sectionRecord(subject, grade, ch.no, sec);
  const badge = sectionBadge(rec);
  const answered = sectionAnswered(rec);
  const mastery = sectionMastery(rec);
  const res = resourcesFor(subject, ch.no, sec);
  const remaining = res.reduce((n, r) => n + (resourceRemaining(r) ?? 0), 0);
  const needs = sectionNeeds(rec);
  const label = topicLabel(subject, grade, ch, sec);
  const tid = topicIdOf(subject, grade, ch.no, sec);
  // اگر نام دادهٔ اولیه یا ویرایش کاربر موجود باشد، برچسب «قابل ویرایش» لازم نیست.
  const hasRealName = !/^گفتار \d+( · نام ثبت نشده)?$/.test(label);
  return `<tr>
<td>${sec}</td>
<td><strong>${esc(label)}</strong>${hasRealName ? '' : ' <span class="pill gray">قابل ویرایش</span>'}</td>
<td>${esc(ch.title)}</td>
<td>${rec?.updatedAt ? `${answered}/۸ سؤال` : '—'}</td>
<td>${mastery === null ? 'نامشخص' : mastery + '٪'}</td>
<td>${res.length ? `${res.length} منبع${remaining ? ` · ${remaining} باقی‌مانده` : ''}` : '—'}</td>
<td>${needs.length ? esc(needs.map((n) => n.label).join(' · ')) : '—'}</td>
<td><span class="pill ${badge.tone === 'ok' ? 'ok' : badge.tone === 'danger' ? 'danger' : 'warn'}">${esc(badge.text)}</span></td>
<td>${actionBtn(rec?.updatedAt ? 'ویرایش ارزیابی' : 'ارزیابی گفتار', `assess:${subject}:${grade}:${ch.no}:${sec}`, rec?.updatedAt ? '' : 'primary')} ${actionBtn('منابع', `resources:${subject}:${ch.no}:${sec}`)} ${actionBtn('تغییر نام', `syl-rename-section:${tid}`)} ${actionBtn('حذف', `syl-delete-section:${tid}`, 'danger')}</td>
</tr>`;
}

function syllabusTree(subject, grade) {
  const chapters = syllabusChapters(subject, grade);
  if (!chapters.length) return emptyState('سرفصلی برای این پایه ثبت نشده', 'در تنظیمات یا بانک دروس، فصل‌ها را اضافه یا اصلاح کنید.');
  let out = '';
  for (const ch of chapters) {
    const count = chapterSectionCount(ch);
    const secs = count === null ? [] : Array.from({ length: count }, (_, i) => i + 1);
    const recs = secs.map((s) => sectionRecord(subject, grade, ch.no, s)).filter(Boolean);
    const open = recs.reduce((n, r) => n + sectionNeeds(r).length, 0);
    const done = recs.filter((r) => sectionNeeds(r).length === 0).length;
    out += `<article class="card tone-study"><div class="section-row"><h3 class="card-title">فصل ${ch.no} · ${esc(ch.title)}</h3><span class="pill ${count === null ? 'gray' : open ? 'warn' : 'ok'}">${count === null ? 'تعداد گفتار نامشخص' : `${done}/${count} گفتار بدون نیاز باز`}</span></div>`;
    if (count === null) {
      out += `<p class="card-body">تعداد گفتارهای این فصل در اطلاعات اولیه ثبت نشده است. خودت تعداد را وارد کن تا گفتارها ساخته شوند — عددی ساخته نمی‌شود.</p>`;
      out += `<div class="button-row">${actionBtn('＋ افزودن گفتار به این فصل', `syl-add-section:${subject}:${grade}:${ch.no}`)} ${actionBtn('ویرایش عنوان فصل', `syl-edit-chapter:${subject}:${grade}:${ch.no}`)}</div>`;
    } else {
      out += `<div class="table-wrap"><table><thead><tr><th>گفتار</th><th>فصل</th><th>ارزیابی</th><th>تسلط</th><th>منابع</th><th>نیازهای باز</th><th>وضعیت</th><th></th></tr></thead><tbody>${secs.map((s) => syllabusSectionRow(subject, grade, ch, s)).join('')}</tbody></table></div>`;
      out += `<div class="button-row">${actionBtn('＋ گفتار', `syl-add-section:${subject}:${grade}:${ch.no}`)} ${actionBtn('ویرایش فصل', `syl-edit-chapter:${subject}:${grade}:${ch.no}`)}</div>`;
    }
    if (open) out += `<div class="advice warning"><span class="advice-mark">!</span><span>${open} نیاز باز در این فصل. این‌ها از پاسخ‌های خودت ساخته شده‌اند و در «عقب‌افتادگی‌ها» به‌صورت کار قابل برنامه‌ریزی در دسترس‌اند.</span></div>`;
    out += `</article>`;
  }
  return out;
}

let resourceSubject = null;

function submitSylSection(form) {
  const d = new FormData(form);
  const { subject, grade, chapter } = sylDraft;
  const section = Math.max(1, num(d.get('section')));

/* ---------- ۸ب. تغییر نام و حذف گفتار ---------- */

/** شناسه را به اجزایش می‌شکافد؛ ``null`` اگر ساختار ناشناس بود. */
function splitTopicId(tid) {
  const parts = String(tid).split('|');
  if (parts.length !== 4) return null;
  const [subject, grade, chapter, section] = parts;
  if (!subject || !Number.isFinite(Number(grade)) || !Number.isFinite(Number(chapter))
      || !Number.isFinite(Number(section))) return null;
  return { subject, grade: Number(grade), chapter: Number(chapter), section: Number(section) };
}

function sylRenameSectionForm(tid) {
  const parts = splitTopicId(tid);
  if (!parts) { notify('شناسهٔ گفتار نامعتبر است'); return; }
  const { subject, grade, chapter, section } = parts;
  const ch = (syllabusChapters(subject, grade) || []).find((c) => c.no === chapter) || { no: chapter, title: '' };
  const current = (state.topicTitles || {})[tid] || '';
  const base = ((window.K2_SYLLABUS || {})[subject] || {})[String(grade)] || [];
  const baseTopic = (base.find((c) => c.no === chapter) || {}).topics;
  const official = baseTopic && baseTopic.find((t) => Number(String(t.id).split('|')[3]) === section);
  dialog('تغییر نام گفتار', `<form id="modalForm" data-modal-type="syl-rename-section">
<label>نام گفتار<input name="name" value="${esc(current)}" placeholder="${official?.title ? esc(official.title) : 'مثلاً: ساختار و عملکرد لولهٔ گوارش'}"></label>
<p class="card-body">درس ${esc(subject)} · فصل ${chapter} (${esc(ch.title)}) · گفتار ${section}${
  official?.title ? `<br>نام دادهٔ اولیه: <strong>${esc(official.title)}</strong>` : '<br>نام رسمی این گفتار در اطلاعات اولیه ثبت نشده؛ خودت از کتاب سال ۱۴۰۶ وارد کن.'
}</p>
<div class="modal-actions">${actionBtn('انصراف', 'close-dialog')}${actionBtn('ذخیرهٔ نام', 'save-syl-rename-section', 'primary')}</div></form>`);
  sylDraft = { subject, grade, chapter, section, tid };
}

function submitSylRenameSection(form) {
  const d = new FormData(form);
  const { tid } = sylDraft;
  const name = String(d.get('name') || '').trim();
  state.topicTitles = state.topicTitles || {};
  if (name) state.topicTitles[tid] = name;
  else delete state.topicTitles[tid];
  closeDialog();
  persist(name ? 'نام گفتار ذخیره شد' : 'نام به حالت دادهٔ اولیه برگشت');
  render();
}

function sylDeleteSectionForm(tid) {
  const parts = splitTopicId(tid);
  if (!parts) { notify('شناسهٔ گفتار نامعتبر است'); return; }
  const { subject, grade, chapter, section } = parts;
  const ch = (syllabusChapters(subject, grade) || []).find((c) => c.no === chapter) || { no: chapter, title: '' };
  const label = topicLabel(subject, grade, ch, section);
  const hasRecord = !!sectionRecord(subject, grade, chapter, section);
  dialog('حذف گفتار', `<form id="modalForm" data-modal-type="syl-delete-section">
<p class="card-body">گفتار <strong>${esc(label)}</strong> از فصل ${chapter} (${esc(ch.title)}) حذف شود؟${
  hasRecord ? '<br><strong>هشدار:</strong> برای این گفتار ارزیابی ثبت شده است؛ با حذف، آن ارزیابی هم از فهرست خارج می‌شود.' : ''
}<br>حذف بعد از تأیید تو انجام می‌شود و قابل بازگشت نیست.</p>
<div class="modal-actions">${actionBtn('انصراف', 'close-dialog')}${actionBtn('حذف گفتار', 'save-syl-delete-section', 'danger')}</div></form>`);
  sylDraft = { subject, grade, chapter, section, tid };
}

function submitSylDeleteSection() {
  const { subject, grade, chapter, section, tid } = sylDraft;
  const key = sylKey(subject, grade, chapter);
  const ch = state.syllabusEdits[key] || {};
  const base = (window.K2_SYLLABUS?.[subject]?.[String(grade)] || []).find((c) => c.no === chapter) || {};
  const current = ch.sections ?? base.sections ?? 0;
  if (section > current) { notify('این گفتار در فهرست نیست'); return; }
  state.syllabusEdits = state.syllabusEdits || {};
  state.syllabusEdits[key] = { ...ch, sections: Math.max(0, num(current) - 1), confirmed: true };
  // ارزیابی و منابع چسبیده به همین گفتار هم برداشته می‌شوند تا رکورد بی‌صاحب نماند.
  state.sections = state.sections || {};
  delete state.sections[secKey(subject, grade, chapter, section)];
  state.resources = (state.resources || []).filter((r) => !(r.subject === subject
    && num(r.grade) === grade && num(r.chapter) === chapter && num(r.section) === section));
  if (state.topicTitles) delete state.topicTitles[tid];
  closeDialog();
  persist('گفتار حذف شد');
  render();
}

/* ---------- ۶ب. ورود گروهی تعداد گفتارها ---------- */

let sylCountsDraft = null;

/**
 * فرم گروهی تعداد گفتارها.
 *
 * چرا لازم است: دروسی مثل شیمی ۱۰ فصل دارند و هیچ‌کدام تعداد گفتار
 * ثبت‌نشده‌اند. اگر کاربر مجبور باشد فصل‌به‌فصل وارد کند، عملاً هیچ‌وقت
 * وارد نمی‌کند و برنامه روی دادهٔ خالی کار می‌کند. اینجا همهٔ فصل‌ها یک‌جا
 * دیده می‌شوند و خالی گذاشتن یعنی «نامشخص»، نه صفر.
 */
function sylCountsForm(subject, grade) {
  const chapters = syllabusChapters(subject, grade);
  if (!chapters.length) { notify('برای این پایه فصلی ثبت نشده است'); return; }
  sylCountsDraft = { subject, grade };
  const rows = chapters.map((ch) => {
    const count = chapterSectionCount(ch);
    return `<tr><td>${ch.no}</td><td>${esc(ch.title)}</td>`
      + `<td><input type="number" name="sec_${ch.no}" min="0" inputmode="numeric" value="${count === null ? '' : count}" placeholder="نامشخص = خالی"></td>`
      + `<td>${count === null ? '<span class="pill warn">نامشخص</span>' : count}</td></tr>`;
  }).join('');
  const unknown = chapters.filter((c) => chapterSectionCount(c) === null).length;
  dialog(`تعداد گفتارهای ${esc(subject)} · پایهٔ ${grade}`, `<form id="modalForm" data-modal-type="syl-counts">
<p class="card-body">${unknown ? `${unknown} فصل از ${chapters.length} فصل عدد ثبت‌نشده دارند. این‌ها «نامشخص» می‌مانند و برنامه هیچ عددی حدس نمی‌زند.` : 'همهٔ فصل‌ها عدد دارند؛ اگر کتاب ۱۴۰۶ را تطبیق داده‌ای همین‌جا اصلاح کن.'}</p>
<div class="table-wrap"><table><thead><tr><th>#</th><th>عنوان فصل</th><th>تعداد گفتار (خالی = نامشخص)</th><th>فعلی</th></tr></thead><tbody>${rows}</tbody></table></div>
<p class="card-body">تعداد را از روی کتاب سال ۱۴۰۶ خودت بخوان. اگر مطمئن نیستی، خالی بگذار؛ «نامشخص» صادقانه‌تر از یک عدد غلط است.</p>
<div class="modal-actions">${actionBtn('انصراف', 'close-dialog')}${actionBtn('ذخیرهٔ تعدادها', 'save-syl-counts', 'primary')}</div></form>`);
}

function submitSylCounts(form) {
  const d = new FormData(form);
  const { subject, grade } = sylCountsDraft;
  const chapters = syllabusChapters(subject, grade);
  state.syllabusEdits = state.syllabusEdits || {};
  let entered = 0, stillUnknown = 0;
  for (const ch of chapters) {
    const raw = d.get(`sec_${ch.no}`);
    const key = sylKey(subject, grade, ch.no);
    const prev = state.syllabusEdits[key] || {};
    if (raw === null || raw === undefined || String(raw).trim() === '') {
      // خالی = نامشخص. اگر قبلاً تعدادی ثبت شده بود، همان می‌ماند.
      stillUnknown += 1;
      if (prev.sections !== undefined) {
        state.syllabusEdits[key] = { ...prev, sections: null, confirmed: true };
      }
      continue;
    }
    state.syllabusEdits[key] = { ...prev, sections: Math.max(0, num(raw)), confirmed: true };
    entered += 1;
  }
  closeDialog();
  persist(entered
    ? `${entered} فصل با تعداد گفتار ثبت شد${stillUnknown ? ` · ${stillUnknown} فصل نامشخص ماند` : ''}`
    : 'هیچ تعدادی وارد نشد؛ همه «نامشخص» ماندند');
  render();
}

/* ---------- ۱۰. نمای یکپارچهٔ سرفصل در صفحهٔ مباحث ---------- */

function syllabusOverview() {
  const subjects = selectedSubjects();
  const meta = window.K2_SYLLABUS_META || {};
  const statusNote = `<div class="advice"><span class="advice-mark">i</span><span>سرفصل‌های زیر <strong>${esc(meta.statusLabel || 'اطلاعات اولیه · تأییدنشده')}</strong> هستند. با نسخهٔ معتبر کتاب‌های ۱۴۰۶ تطبیق نشده‌اند؛ عنوان فصل، تعداد گفتار و هر چیزی را خودت اصلاح کن. هیچ بخش جدیدی بی‌اطلاع تو جایگزین نمی‌شود.</span></div>`;
  if (!subjects.length) return statusNote + emptyState('اول درس‌ها را انتخاب کن', 'در «بانک دروس» درس‌های خودت را انتخاب کن تا سرفصل‌ها نمایش داده شود.', actionBtn('رفتن به بانک دروس', 'go-courses'));
  let out = statusNote;
  for (const s of subjects) {
    // همهٔ پایه‌هایی که برای این درس فهرست فصل دارند نشان داده می‌شوند؛ درس‌های
    // عمومی ممکن است فقط در یک پایه سرفصل داشته باشند.
    const byGrade = ((window.K2_SYLLABUS || {})[s.name] || {});
    const gradeKeys = Object.keys(byGrade).map(Number).filter((g) => Number.isFinite(g));
    const gradeList = gradeKeys.length ? gradeKeys.sort((a, b) => a - b) : [gradeOfSubject(s.name)];
    for (const grade of gradeList) {
    const chapters = syllabusChapters(s.name, grade);
    if (!chapters.length) continue;
    const known = chapters.filter((c) => chapterSectionCount(c) !== null);
    const totalSec = known.reduce((n, c) => n + chapterSectionCount(c), 0);
    const assessed = (state.sections ? Object.keys(state.sections) : []).filter((k) => k.startsWith(`${s.name}|${grade}|`)).length;
    const allUnknown = chapters.length > 0 && known.length === 0;
    out += `<article class="card tone-exam"><div class="section-row"><h3 class="card-title">${esc(s.name)} · پایهٔ ${grade}</h3><span class="pill ${totalSec ? (assessed < totalSec ? 'warn' : 'ok') : 'gray'}">${totalSec ? `${assessed} از ${totalSec} گفتار ارزیابی‌شده` : 'تعداد گفتار نامشخص'}</span></div>`;
    out += `<div class="button-row">${actionBtn('نمایش گفتارها', `syllabus-open:${esc(s.name)}:${grade}`, 'primary')} ${actionBtn('منابع این درس', `resource-subject:${esc(s.name)}`)}${allUnknown ? ` ${actionBtn('ورود تعداد گفتارها', `syl-counts:${esc(s.name)}:${grade}`, 'primary')}` : ''}</div>`;
    if (allUnknown) out += `<div class="advice warning"><span class="advice-mark">!</span><span>تعداد گفتارهای این درس در اطلاعات اولیه ثبت نشده (${chapters.length} فصل، همه نامشخص). برنامه هیچ عددی حدس نمی‌زند و صفر فرض نمی‌کند؛ تا وقتی خودت از کتاب سال ۱۴۰۶ بخوانی و وارد کنی، ارزیابی گفتاربه‌گفتار برای این درس ممکن نیست.</span></div>`;
    out += `</article>`;
    }
  }
  return out;
}

function syllabusDetail(subject, grade) {
  return `<div class="button-row">${actionBtn('← بازگشت به فهرست سرفصل‌ها', 'syllabus-close')}</div>` + syllabusTree(subject, grade);

/** کلاس‌های ثابت اولیه را با علامت «نیازمند تأیید» اضافه می‌کند. */
function seedFixedClasses() {
  state.events = state.events || [];
  let added = 0;
  for (const c of FIXED_CLASSES_SEED) {
    const dup = state.events.some((e) => e.title === c.title && Number(e.weekday) === c.weekday);
    if (dup) continue;
    state.events.push({
      id: id(), title: c.title, kind: c.kind, weekday: c.weekday,
      start: c.start, end: c.end, recorded: false,
      subjectId: '', subjectName: c.title,
      note: c.note || 'ساعت اولیهٔ اعلام‌شده؛ پیش از استفاده تأیید کنید',
      fromSeed: true, needsConfirmation: true,
    });
    added += 1;
  }
  persist(added
    ? `${added} کلاس با علامت «نیازمند تأیید» اضافه شد`
    : 'همهٔ کلاس‌های اولیه از قبل ثبت شده‌اند');
  render();
}

/** برچسب وضعیت تأیید یک رویداد. */
function eventConfirmBadge(e) {
  if (!e.needsConfirmation) return '';
  const unknownTime = !e.start || !e.end;
  return `<span class="pill warn">${unknownTime ? 'ساعت نامشخص · نیازمند تأیید' : 'نیازمند تأیید'}</span>`;
}

/** هشدار کلاس‌های ساعت‌نامشخص: تا وارد نشوند اشغال‌شده شمرده نمی‌شوند. */
function unknownClassNote() {
  const unknown = (state.events || []).filter((e) => e.needsConfirmation && (!e.start || !e.end));
  if (!unknown.length) return '';
  return `<div class="advice warning"><span class="advice-mark">!</span><span>${unknown.length} کلاس «ساعت نامشخص» دارد. تا وارد نکنی، در برنامه اشغال‌شده شمرده نمی‌شود؛ ساعت قطعی از خودت ساخته نشده است.</span></div>`;
}

/* ==========================================================================
   مدیریت عقب‌افتادگی‌ها — سند پایدار، نه فهرست موقت
   ==========================================================================
   اصل طراحی: عقب‌افتادگی **حذف نمی‌شود**. با ساخت برنامهٔ جدید هم پاک
   نمی‌شود؛ یا انجام می‌شود، یا به روز دیگر منتقل می‌شود، یا با تصمیم
   آگاهانهٔ کاربر وضعیتش عوض می‌شود.

   برای همین عقب‌افتادگی سند پایدار است (state.backlogs) و فعالیت زمان‌بندی
   از آن **مشتق** می‌شود (activity.backlogId). تکمیل فعالیت، باقی‌ماندهٔ
   عقب‌افتادگی را کم می‌کند ولی خودش را حذف نمی‌کند.
   ========================================================================== */

/* ---------- ۱. دوازده نوع عقب‌افتادگی ---------- */

//: (کلید، برچسب، مدت تخمینی پیش‌فرض به دقیقه)
//: مدت‌ها **فرضیهٔ محصول [H]** هستند و در فرم قابل ویرایشند؛ عدد سؤال یا
//: صفحه ساخته نمی‌شود.
const BACKLOG_TYPES = [
  ['class', 'عقب‌افتادگی کلاس یا جلسهٔ آموزشی', 60],
  ['video', 'فیلم آموزشی دیده‌نشده', 45],
  ['study', 'مطالعه ناقص', 40],
  ['concept', 'نفهمیدن یا نیاز به رفع اشکال', 50],
  ['review', 'مرور انجام‌نشده', 25],
  ['consolidation', 'تثبیت ناقص', 30],
  ['testing', 'تست‌نزدن', 45],
  ['analysis', 'تحلیل‌نکردن آزمون', 40],
  ['essay', 'تمرین تشریحی انجام‌نشده', 45],
  ['homework', 'تکلیف انجام‌نشده', 35],
  ['multiple', 'چند مورد هم‌زمان', 0],
  ['other', 'مورد دیگر (با توضیح دلخواه)', 30],
];

const BACKLOG_TYPE_LABEL = Object.fromEntries(BACKLOG_TYPES);
const BACKLOG_TYPE_ESTIMATE = Object.fromEntries(BACKLOG_TYPES.map(([k, , e]) => [k, e]));

const BACKLOG_STATUS = {
  open: 'باز · انجام نشده',
  scheduled: 'در برنامهٔ امروز',
  in_progress: 'در حال انجام',
  partial: 'ناقص انجام شده',
  done: 'انجام شده',
  deferred: 'به روز دیگر منتقل شد',
};

const BACKLOG_IMPORTANCE = { 1: 'کم', 2: 'متوسط', 3: 'زیاد', 4: 'بسیار زیاد', 5: 'حیاتی' };

/** مدت تخمینی کل بر اساس نوع‌های انتخاب‌شده. */
function backlogEstimate(types) {
  return (types || []).reduce((n, t) => n + BACKLOG_TYPE_ESTIMATE[t], 0);
}

/** برچسب خوانا برای فهرست نوع‌ها. */
function backlogTypesLabel(types) {
  const list = (types || []).filter((t) => t !== 'multiple');
  const hasMulti = (types || []).includes('multiple');
  const parts = list.map((t) => BACKLOG_TYPE_LABEL[t] || t);
  if (hasMulti) parts.unshift('چند مورد هم‌زمان');
  return parts.join(' · ') || '—';
}

/** برچسب انواع برای نمایش کوتاه در جدول. */
function backlogTypePills(types) {
  return (types || [])
    .map((t) => `<span class="pill ${t === 'multiple' ? 'warn' : 'info'}">${esc(BACKLOG_TYPE_LABEL[t] || t)}</span>`)
    .join(' ');
}

/* ---------- ۲. فرم ثبت عقب‌افتادگی (انتخاب چندگانه) ---------- */

function addBacklogForm(backlog) {
  const subjects = selectedSubjects();
  const b = backlog || {};
  const types = b.types || [];
  const subject = b.subject || subjects[0]?.name || '';
  const chapters = subject ? syllabusChapters(subject, num(b.grade, gradeOfSubject(subject))) : [];
  const estimate = b.estimate ?? backlogEstimate(types);
  let body = `<form id="modalForm" data-modal-type="backlog" ${backlog ? `data-backlog-id="${b.id}"` : ''}>`;
  body += `<p class="card-body">نوع‌های عقب‌افتادگی را <strong>هم‌زمان</strong> می‌توانی انتخاب کنی. مثلاً اگر گفتاری را نخوانده‌ای، نفهمیده‌ای و تست هم نزده‌ای، هر سه را علامت بزن؛ زمان هر کدام جدا برآورد می‌شود.</p>`;
  body += `<div class="form-grid">`;
  body += `<label>درس<select name="subject">${subjects.map((s) => `<option value="${esc(s.name)}" ${s.name === subject ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`;
  body += `<label>عنوان / مبحث<input name="title" required value="${esc(b.title || '')}" placeholder="مثلاً گفتار ۳ فصل ۲ زیست"></label>`;
  body += `<label>فصل<select name="chapter"><option value="">— بدون فصل —</option>${chapters.map((c) => `<option value="${c.no}" ${String(b.chapter) === String(c.no) ? 'selected' : ''}>فصل ${c.no} · ${esc(c.title)}</option>`).join('')}</select></label>`;
  body += `<label>گفتار<input name="section" type="number" min="0" inputmode="numeric" value="${b.section ?? ''}" placeholder="اختیاری"></label>`;
  body += `</div>`;

  body += `<fieldset style="border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0"><legend style="font-size:12px;font-weight:800;color:var(--muted);padding:0 6px">نوع عقب‌افتادگی (چند مورد مجاز است)</legend>`;
  for (const [key, label] of BACKLOG_TYPES) {
    const on = types.includes(key);
    body += `<label class="check-label" style="margin:5px 0"><input type="checkbox" name="types" value="${key}" ${on ? 'checked' : ''}> ${esc(label)}${BACKLOG_TYPE_ESTIMATE[key] ? ` <small style="color:var(--muted)">(~${BACKLOG_TYPE_ESTIMATE[key]} دقیقه)</small>` : ''}</label>`;
  }
  body += `</fieldset>`;

  body += `<div class="form-grid">`;
  body += `<label>مدت تخمینی کل (دقیقه)<input name="estimate" type="number" min="0" inputmode="numeric" value="${estimate ?? ''}"></label>`;
  body += `<label>باقی‌مانده (دقیقه)<input name="remaining" type="number" min="0" inputmode="numeric" value="${b.remaining ?? ''}"></label>`;
  body += `<label>حجم کار (تعداد صفحه/فیلم/تست — اختیاری)<input name="volume" type="number" min="0" inputmode="numeric" value="${b.volume ?? ''}"></label>`;
  body += `<label>انجام‌شده از حجم (اختیاری)<input name="volumeDone" type="number" min="0" inputmode="numeric" value="${b.volumeDone ?? ''}"></label>`;
  body += `<label>اهمیت<select name="importance">${[1, 2, 3, 4, 5].map((i) => `<option value="${i}" ${num(b.importance, 3) === i ? 'selected' : ''}>${BACKLOG_IMPORTANCE[i]}</option>`).join('')}</select></label>`;
  body += `<label>موعد (اختیاری)<input name="due" type="date" value="${esc(b.due || '')}"></label>`;
  body += `</div>`;
  body += `<label>توضیحات<input name="notes" value="${esc(b.notes || '')}" placeholder="مثلاً جزئیات مورد دیگر یا دلیل عقب‌افتادگی"></label>`;
  body += `<div class="modal-actions">${actionBtn('انصراف', 'close-dialog')}${actionBtn(backlog ? 'ذخیرهٔ تغییرات' : 'ثبت عقب‌افتادگی', 'save-backlog', 'primary')}</div>`;
  body += `</form>`;
  dialog(backlog ? 'ویرایش عقب‌افتادگی' : 'ثبت عقب‌افتادگی', body);
}

function submitBacklog(form) {
  const d = new FormData(form);
  const v = (n) => { const x = d.get(n); return x === null || x === '' ? null : x; };
  const title = String(v('title') || '').trim();
  const types = d.getAll('types').map(String);
  if (!title) { notify('عنوان یا مبحث عقب‌افتادگی لازم است'); return; }
  if (!types.length) { notify('حداقل یک نوع عقب‌افتادگی را انتخاب کن'); return; }
  if (types.includes('other') && !String(v('notes') || '').trim()) {
    notify('برای «مورد دیگر» توضیح دلخواه لازم است'); return;
  }
  const estimate = v('estimate') === null ? backlogEstimate(types) : num(v('estimate'));
  const remaining = v('remaining') === null ? estimate : num(v('remaining'));
  if (remaining > estimate && estimate > 0) { notify('باقی‌مانده از مدت تخمینی کل بیشتر است'); return; }
  const backlogId = form.dataset.backlogId || id();
  const existing = (state.backlogs || []).find((x) => x.id === backlogId);
  const obj = {
    id: backlogId,
    title,
    types,
    subject: v('subject') || '',
    subjectName: v('subject') || '',
    grade: num(v('grade'), gradeOfSubject(v('subject') || '')),
    chapter: v('chapter') === null ? null : num(v('chapter')),
    section: v('section') === null ? null : num(v('section')),
    estimate,
    remaining,
    volume: v('volume') === null ? null : num(v('volume')),
    volumeDone: v('volumeDone') === null ? null : num(v('volumeDone')),
    importance: num(v('importance'), 3),
    due: v('due') || '',
    notes: v('notes') || '',
    status: existing?.status || 'open',
    history: existing?.history || [{ at: new Date().toISOString(), action: 'ثبت شد' }],
    createdAt: existing?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
  if (!existing) obj.history = [{ at: new Date().toISOString(), action: 'ثبت شد' }];
  state.backlogs = state.backlogs || [];
  const i = state.backlogs.findIndex((x) => x.id === obj.id);
  if (i >= 0) state.backlogs[i] = obj; else state.backlogs.unshift(obj);
  closeDialog();
  persist(existing ? 'عقب‌افتادگی به‌روزرسانی شد' : 'عقب‌افتادگی ثبت شد');
  render();
}

/* ---------- ۳. مشتق‌سازی فعالیت زمان‌بندی از عقب‌افتادگی ---------- */

/** فعالیت زمان‌بندی‌شدهٔ مربوط به یک عقب‌افتادگی (اگر باشد). */
function backlogActivity(backlogId) {
  return (state.activities || []).find((a) => a.backlogId === backlogId);
}

/** عقب‌افتادگی را در برنامهٔ امروز قرار می‌دهد (فعالیت مشتق می‌سازد). */
function scheduleBacklog(backlogId) {
  const b = (state.backlogs || []).find((x) => x.id === backlogId);
  if (!b) return;
  if (b.status === 'done') { notify('این عقب‌افتادگی انجام شده است'); return; }
  state.activities = state.activities || [];
  const existing = backlogActivity(backlogId);
  const minutes = Math.max(15, num(b.remaining) || num(b.estimate) || 30);
  if (existing) {
    existing.remaining = minutes;
    existing.estimate = minutes;
    existing.state = 'open';
    existing.reason = 'از عقب‌افتادگی به برنامه برگشت';
  } else {
    state.activities.unshift({
      id: id(),
      title: `${backlogTypesLabel(b.types)} · ${b.title}`,
      type: 'consolidation',
      backlogId,
      subjectId: '', subjectName: b.subjectName || b.subject || '',
      examCoefficient: null,
      estimate: minutes, remaining: minutes,
      minChunk: 15, maxChunk: 60, splittable: true,
      deadline: b.due ? 'hard' : '', deadlineDate: b.due || '',
      state: 'open', reason: 'مشتق از عقب‌افتادگی',
      createdAt: new Date().toISOString(),
    });
  }
  b.status = 'scheduled';
  b.history.push({ at: new Date().toISOString(), action: 'در برنامهٔ امروز قرار گرفت' });
  persist('عقب‌افتادگی در برنامهٔ امروز قرار گرفت');
  render();
}

/** تکمیل/پیشرفت فعالیت مشتق، باقی‌ماندهٔ عقب‌افتادگی را کم می‌کند. */
function syncBacklog(backlogId, doneMinutes) {
  const b = (state.backlogs || []).find((x) => x.id === backlogId);
  if (!b) return;
  const before = num(b.remaining);
  b.remaining = Math.max(0, before - num(doneMinutes));
  b.volumeDone = b.volume !== null && b.volume !== undefined
    ? Math.min(num(b.volume), num(b.volumeDone) + 1) : b.volumeDone;
  b.status = b.remaining > 0 ? 'partial' : 'done';
  b.history.push({
    at: new Date().toISOString(),
    action: b.remaining > 0
      ? `${num(doneMinutes)} دقیقه انجام شد · ${b.remaining} دقیقه باقی مانده`
      : 'انجام شد',
  });
  b.updatedAt = new Date().toISOString();
}

/** انتقال عقب‌افتادگی به روز دیگر با تصمیم آگاهانهٔ کاربر. */
function deferBacklog(backlogId) {
  const b = (state.backlogs || []).find((x) => x.id === backlogId);
  if (!b) return;
  const reason = prompt('دلیل انتقال به روز دیگر را بنویسید:');
  if (!reason || !reason.trim()) return;
  b.status = 'deferred';
  b.notes = `${b.notes ? b.notes + ' · ' : ''}انتقال: ${reason.trim()}`;
  b.history.push({ at: new Date().toISOString(), action: `به روز دیگر منتقل شد · ${reason.trim()}` });
  b.updatedAt = new Date().toISOString();
  // فعالیت مشتق حذف نمی‌شود؛ از برنامه بیرون می‌رود ولی عقب‌افتادگی می‌ماند.
  state.activities = (state.activities || []).filter((a) => a.backlogId !== backlogId);
  persist('عقب‌افتادگی به روز دیگر منتقل شد');
  render();
}

/* ---------- ۴. صفحهٔ عقب‌افتادگی‌ها ---------- */

function backlogsPage() {
  const list = state.backlogs || [];
  const open = list.filter((b) => !['done'].includes(b.status));
  const done = list.filter((b) => b.status === 'done');
  const totalRemaining = open.reduce((n, b) => n + num(b.remaining), 0);
  const overdue = open.filter((b) => b.due && b.due < todayISO());
  const plan = makePlan();
  const capacity = plan.capacity;
  const over = totalRemaining > capacity;

  const rows = open.map((b) => {
    const act = backlogActivity(b.id);
    const inPlan = act && !['done', 'dropped'].includes(act.state);
    return `<tr>
<td>${esc(b.title)}</td>
<td>${esc(b.subjectName || '—')}${b.chapter ? ` · فصل ${b.chapter}` : ''}${b.section ? ` · گفتار ${b.section}` : ''}</td>
<td>${backlogTypePills(b.types)}</td>
<td>${b.volume === null || b.volume === undefined ? '—' : `${num(b.volumeDone)}/${b.volume}`}</td>
<td>${fmtMin(num(b.remaining))}</td>
<td>${fmtMin(num(b.estimate))}</td>
<td>${esc(b.due || '—')}${b.due && b.due < todayISO() ? ' <span class="pill danger">از موعد گذشته</span>' : ''}</td>
<td>${BACKLOG_IMPORTANCE[num(b.importance, 3)] || '—'}</td>
<td>${esc(BACKLOG_STATUS[b.status] || b.status)}${inPlan ? ' <span class="pill ok">در برنامهٔ امروز</span>' : ''}</td>
<td>${actionBtn('در برنامهٔ امروز', `backlog-schedule:${b.id}`, 'primary')} ${actionBtn('ویرایش', `backlog-edit:${b.id}`)} ${actionBtn('انتقال به روز دیگر', `backlog-defer:${b.id}`)}</td>
</tr>`;
  }).join('');

  const suggestion = over
    ? `حجم باقی‌مانده (${fmtMin(totalRemaining)}) از ظرفیت امروز (${fmtMin(capacity)}) بیشتر است. سه راه واقع‌بینانه: (۱) فقط مهم‌ترین‌ها را در برنامه بگذار و بقیه را با «انتقال به روز دیگر» آگاهانه جابه‌جا کن؛ (۲) حجم کار را کم کن؛ (۳) بازبینی اولویت را عوض کن. هیچ‌کدام به‌صورت خودکار انجام نمی‌شود.`
    : 'حجم باقی‌مانده با ظرفیت امروز سازگار است.';

  return `<div class="page-scroll">${pageHeader('عقب‌افتادگی‌ها', `${open.length} مورد باز · ${fmtMin(totalRemaining)} باقی‌مانده`, actionBtn('＋ ثبت عقب‌افتادگی', 'add-backlog', 'primary'))}
${overdue.length ? `<div class="advice warning"><span class="advice-mark">!</span><span>${overdue.length} عقب‌افتادگی از موعدش گذشته است. برای هر کدام تصمیم بگیر: انجام، انتقال آگاهانه، یا تغییر اولویت.</span></div>` : ''}
<div class="advice ${over ? 'warning' : ''}"><span class="advice-mark">${over ? '!' : 'i'}</span><span>${esc(suggestion)}</span></div>
<div class="metrics">
<article class="metric tone-backlog"><p class="metric-label">باقی‌مانده</p><p class="metric-value">${fmtMin(totalRemaining)}</p><p class="metric-hint">${open.length} مورد باز</p></article>
<article class="metric tone-timer"><p class="metric-label">ظرفیت امروز</p><p class="metric-value">${fmtMin(capacity)}</p><p class="metric-hint">پس از تعهدها</p></article>
<article class="metric tone-ok"><p class="metric-label">انجام‌شده</p><p class="metric-value">${done.length}</p><p class="metric-hint">از ${list.length} مورد</p></article>

</div>
