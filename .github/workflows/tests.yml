name: tests

# اجرای سریع تست‌ها روی لینوکس و ویندوز (بدون بسته‌بندی)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require HTML preview update with application source changes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base_sha="$PR_BASE"; fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then exit 0; fi
          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          if grep -Eq '^(src/|k2\.spec$)' <<< "$changed_files" && ! grep -qx 'preview/K2-preview.html' <<< "$changed_files"; then
            echo "::error::Application source changed; update preview/K2-preview.html in the same push."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt system runtime libraries (Ubuntu headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # آزمون‌های پیش‌نمایش (فصل/گفتار، ارزیابی، برنامه) روی node اجرا می‌شوند؛
      # بدون این گام، هر تست skipif(NODE is None) در CI از کار می‌افتد.
      - name: Set up Node.js for preview harness tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node is available to the test harness
        shell: bash
        run: |
          node --version
          python -c "import shutil, sys; sys.exit(0 if shutil.which('node') or shutil.which('nodejs') else 1)"

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set +e
          python -m pytest tests -q -rf > pytest-out.txt 2>&1
          code=$?
          grep -E "^(FAILED|ERROR)" pytest-out.txt | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -2 pytest-out.txt
          exit $code
